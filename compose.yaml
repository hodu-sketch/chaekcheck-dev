# Local infrastructure for chaekcheck development and tests.
# Docker runs inside WSL (Ubuntu); WSL2 forwards the published ports to Windows localhost.
# Build:  wsl -d Ubuntu -- docker compose build        (PostgreSQL 18 + pg_bigm + pg_search image, docker/postgres-bigm;
#         an image built before 2026-10-30 has no pg_search and does not start with the preload below: build again)
# Start:  wsl -d Ubuntu -- docker compose up -d      (run from this directory)
# Stop:   wsl -d Ubuntu -- docker compose down
# Values come from .env (copy .env.example to .env and fill it in).
# WSL shuts down a few seconds after its last process ends, which stops these containers.
# restart: unless-stopped brings them back when WSL (and its Docker service) starts again.

name: chaekcheck

services:
  db:
    build: docker/postgres-bigm
    image: chaekcheck/postgres-bigm:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Memory settings (cycle 08, plan ADR-0066): values from .env, defaults below. This replaces the image's CMD, so
    # pg_bigm and pg_search must stay in shared_preload_libraries here. Defaults: measured on the local PC (WSL2, 32GB) on 2026-10-11,
    # one step above the smallest that kept the first-page p95 (user choice "한 단계 여유"); a container limit of 1GB
    # fits them. Measure again on the production server (docs/cycles/plan-feedback.md # 사이클 08, 9단계).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_bigm,pg_search
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${DB_WORK_MEM:-4MB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production-role database (cycle 11, ADR-0078): the separate import's apply runs here, under the production
  # server's memory limit, while a service on it answers searches. Same image, settings and database as db; started
  # as a copy of db (docs/maintenance/3-import.md 13). Start it only for that test: docker compose up -d db-ops
  db-ops:
    image: chaekcheck/postgres-bigm:18
    restart: "no"
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_bigm,pg_search
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${DB_WORK_MEM:-4MB}
    ports:
      - "${OPS_DB_PORT:-5434}:5432"
    volumes:
      - db-ops-data:/var/lib/postgresql
    # the production server's container limit (cycle 11 R-A6 [확정]); compose: mem_limit "configures a limit on the
    # amount of memory a container can allocate" (https://docs.docker.com/reference/compose-file/services/)
    mem_limit: 1g
    profiles:
      - ops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway database for ./gradlew test. Data lives in memory and is gone after `down`.
  db-test:
    build: docker/postgres-bigm
    image: chaekcheck/postgres-bigm:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:?set TEST_DB_NAME in .env}
      POSTGRES_USER: ${TEST_DB_USERNAME:?set TEST_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?set TEST_DB_PASSWORD in .env}
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  # cycle 11 production-role database (db-ops)
  db-ops-data:
