// Fetch service (ADR-0011, ADR-0015): GETs library pages for the main service and returns status and raw bytes.
// Separate deployment unit, not a Spring Modulith module. No cache and no host throttling here.
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chaekcheck'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Library sites whose host name has an underscore (cycle 18, ADR-0111): java.net.http refuses such URIs, so
	// LibraryClient sends those requests with Apache HttpClient 5, the same library as the main service. Version
	// managed by Spring Boot.
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
