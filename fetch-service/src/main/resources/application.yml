spring:
  application:
    name: chaekcheck-fetch
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${PORT:8091}
  # finish in-flight fetches on shutdown; new requests get 503
  shutdown: graceful

fetch:
  # TODO(확인 필요): header name and how the shared token is stored (same values as the main service)
  token-header: X-Fetch-Token
  token: ${FETCH_SERVICE_TOKEN:}
  # TODO: same value as the main service user-agent; service URL and contact are not decided yet
  user-agent: ${FETCH_USER_AGENT:chaekcheck/0.0.1}
  # library call timeouts: same as the main service direct mode (connect 5s since 2026-09-29, read 5s)
  connect-timeout: 5s
  read-timeout: 5s
  # [안] whole library request including the body (the read timeout above stops at the response headers).
  # 15s = the longest wait before the headers today (connect 5s + read 5s) + 5s for the body, so no answer that
  # works now is cut; a library that sends its body very slowly can no longer hold a slot without end.
  # The main service gives up on this server after its own read timeout (7s) anyway.
  total-timeout: 15s
  # Largest library body read, compressed and decompressed both (gzip is asked for and inflated here, cycle 20);
  # past it the call stops reading and fails as BODY_TOO_LARGE, which the main service records as body_too_large.
  # Largest real answers saved (2026-10-05, data/cycle07/probe): BOOKCUBE search XML 322KB (20 rows), KYOBO
  # search page 188KB. 4MB -> 1MB [확정] (cycle 20 review #7), the same value as the main service
  # (LOOKUP_MAX_BODY_MB in production); 32 slots x 1MB (x1.33 as base64) stays near 43MB at worst.
  # Environment variable: FETCH_MAXBODYSIZE. ../../../../docs/maintenance/settings-index.md
  max-body-size: 1MB
  # [안] requests handled at once; more get 503 so the main service tries the next fetch server
  max-concurrent: 32
  allow-loopback: false
  # Egress lanes (cycle 22, ADR-0130, handoff 1-15 #5): the SAME list as the main service's
  # chaekcheck.availability.egress.* (the production compose passes one value to both). The main service picks the
  # lane and names it in the request (lane: direct | proxy-01 …); this server maps the id to the proxy. A request for
  # a lane missing here or excluded by the mode is answered outcome=ERROR. Environment: FETCH_EGRESS_MODE,
  # FETCH_EGRESS_PROXIES, FETCH_EGRESS_PROXYVENDOR, FETCH_EGRESS_PROXYUSERNAME, FETCH_EGRESS_PROXYPASSWORD.
  # ../../../../docs/maintenance/settings-index.md
  egress:
    mode: ${FETCH_EGRESS_MODE:all}
    proxies: ${FETCH_EGRESS_PROXIES:}
    proxy-vendor: ${FETCH_EGRESS_PROXYVENDOR:webshare}
    proxy-username: ${FETCH_EGRESS_PROXYUSERNAME:}
    proxy-password: ${FETCH_EGRESS_PROXYPASSWORD:}
