# EC2 deployment behind the named Cloudflare Tunnel (cycle 17; zero-downtime cycle 27, ADR-0167/0168).
# cloudflared runs as a container in the same compose network and sends chaekcheck.com to http://nginx:80 (the tunnel
# route set in the Cloudflare dashboard, plan 17 research), so this server listens on 80 and the web service carries
# the network alias nginx. Like tunnel-test.conf: the visitor's address comes from CF-Connecting-IP, trusted only from
# the private Docker ranges where cloudflared is; plain http is sent to https.
#
# The upstream is in active-backend.conf (written by switch.sh, pointing at backend-blue or backend-green).
# The web root uses the server path with a symlink: releases/X.Y.Z/ + current (ADR-0168).

# Per-IP limit zones (http context); the limits are applied in chaekcheck-locations.conf.
include /etc/nginx/chaekcheck/rate-limits.conf;

# Active backend slot (blue or green), written by bin/switch.sh (cycle 27, ADR-0167).
include /etc/nginx/chaekcheck/active-backend.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    root /srv/chaekcheck/web/current;

    include /etc/nginx/chaekcheck/chaekcheck-locations.conf;
}
