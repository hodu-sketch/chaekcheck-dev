# Per-IP limits for the APIs that make the server call library sites (user request 2026-10-05). These directives
# belong in the http context: include this file at the top of the conf.d file (chaekcheck.conf, local-test.conf),
# outside any server block. The limits themselves are applied in chaekcheck-locations.conf.
#
# All values are [안] (proposals, not confirmed); tune them with real traffic.
#
# The key is the client address as nginx sees it. TODO(확인 필요): if a load balancer or CDN sits in front of nginx
# at deployment, set real_ip_header / set_real_ip_from first, or every user shares the balancer's address.
# Users behind one shared address (an office, a school, a mobile carrier NAT) share these limits too.

# Request rate: one new search stream, next batch or per-library "more" call every 2 seconds on average (30r/m),
# with a burst of 20 taken at once (nodelay in the locations). The web app sends one request per search and one per
# "more" click, so a person stays far below this; a script calling in a loop is cut after about 20 calls.
# 10m of shared memory holds about 160,000 addresses.
limit_req_zone $binary_remote_addr zone=chaekcheck_library_calls:10m rate=30r/m;

# Concurrent connections (HTTP/2: concurrent requests) per address on the same APIs. A search stream stays open up
# to 35s (detail deadline 30s + 5s grace) and the search screen opens one or two streams at once (e-book results
# and holdings), so 6 allows about three tabs searching at the same moment.
limit_conn_zone $binary_remote_addr zone=chaekcheck_library_conns:10m;
