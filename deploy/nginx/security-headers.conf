# Security headers for the web files (handoff cycle 05 step 16). API responses get their headers from Spring Security.
# Included in every location that serves web files: nginx drops server-level add_header lines in a location that has
# its own add_header, so the headers are listed here once and included where needed.
#
# CSP tested against the `npm run build` output on 2026-10-04 (deploy/nginx/README.md):
# - script-src 'self': the build has one module script file and no inline script.
# - style-src 'self' 'unsafe-inline': Radix Dialog (react-remove-scroll-bar) adds a <style> element when a dialog
#   opens; its text holds the scrollbar width, so a hash cannot match. Scripts stay strict.
# - img-src 'self' data:: Vite inlines small images (Kakao symbol) and CSS icons as data: URLs.
#   https://d1bdzw8sfjph5d.cloudfront.net: the book covers on CloudFront (cycle 26, ADR-0163; the web's COVERS_BASE_URL).
# - font-src 'self': NanumBarunGothic is self-hosted.
# - connect-src 'self': all API calls and streams are same-origin /api.
# - form-action 'self': no form posts elsewhere; logins start with a page move to /api/v1/auth/oauth2/... .
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://d1bdzw8sfjph5d.cloudfront.net; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# TODO(확인 필요): max-age, includeSubDomains and preload are decided at deployment, with the domain.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
