# Public trial through a Cloudflare quick tunnel (user request 2026-10-05): local-test.conf plus the visitor's real
# address. cloudflared runs on this computer and connects to port 8088, so every request reaches nginx from a local
# address; without the lines below every visitor would share one per-IP limit (README "real_ip" TODO). Only local
# and private addresses are trusted to set CF-Connecting-IP. Not the production config.

# Per-IP limit zones (http context); the limits are applied in chaekcheck-locations.conf.
include /etc/nginx/chaekcheck/rate-limits.conf;

upstream chaekcheck_backend {
    # Set by the docker command (README): the address where the backend on this computer is reachable.
    server backend-host:8080;
    keepalive 16;
}

server {
    listen 8088;
    server_name localhost;
    server_tokens off;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Cloudflare also answers plain http and passes it on with X-Forwarded-Proto: http. Send those visitors to https
    # so the browser never shows the site as "not secure" (user request 2026-10-05).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;

    include /etc/nginx/chaekcheck/chaekcheck-locations.conf;
}
