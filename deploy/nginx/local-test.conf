# Local check of the example (deploy/nginx/README.md): the same locations and headers as chaekcheck.conf, over plain
# HTTP on port 8088, with web/dist mounted at /usr/share/nginx/html. Not for deployment.

# Per-IP limit zones (http context); the limits are applied in chaekcheck-locations.conf.
include /etc/nginx/chaekcheck/rate-limits.conf;

upstream chaekcheck_backend {
    # Set by README's docker command: the address where the backend on this computer is reachable.
    server backend-host:8080;
    keepalive 16;
}

server {
    listen 8088;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;

    include /etc/nginx/chaekcheck/chaekcheck-locations.conf;
}
