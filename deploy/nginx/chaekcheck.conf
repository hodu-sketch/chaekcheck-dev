# Production example for chaekcheck (handoff cycle 05 step 16). The web server product and the place it runs are
# decided at deployment; this is nginx because it is a common choice and easy to read. Put this file in nginx's
# conf.d and the other two files (chaekcheck-locations.conf, security-headers.conf) in /etc/nginx/chaekcheck/.
#
# One origin serves both the web files and /api, so cookies stay first-party and no CORS is needed.
# AUTH_PUBLIC_BASE_URL in the backend must be https://<server_name>.

upstream chaekcheck_backend {
    # TODO(확인 필요): where the backend runs at deployment; 8080 is the Spring Boot default.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # TODO(확인 필요): domain
    server_name chaekcheck.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # TODO(확인 필요): domain
    server_name chaekcheck.example;

    # TODO(확인 필요): certificate files (for example from Let's Encrypt)
    ssl_certificate     /etc/ssl/chaekcheck/fullchain.pem;
    ssl_certificate_key /etc/ssl/chaekcheck/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # TODO(확인 필요): where the `npm run build` output (web/dist) is copied at deployment
    root /srv/chaekcheck/web;

    include /etc/nginx/chaekcheck/chaekcheck-locations.conf;
}
