# Locations shared by chaekcheck.conf (production example) and local-test.conf. The including server block sets
# `root` to the `web/dist` build output and defines `upstream chaekcheck_backend` (the Spring backend).

# Spring backend, same origin. Spring Security adds the API response headers while login is on.
location /api/ {
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# Search streams (text/event-stream): pass each event on at once instead of buffering the body.
location ~ ^/api/v1/.+/stream$ {
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # TODO(확인 필요): longest stream time; the batch deadline is 30s (application.yml).
    proxy_read_timeout 120s;
}

# Screen routes of the web app (web/src/main.tsx) all get index.html; the app draws the screen.
location = / {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
location ~ ^/(search|signup|terms|privacy|auth/complete|books/[^/]+)$ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# Build files with a content hash in the name never change.
location /assets/ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Other files in dist (favicon, index.html itself). Unknown paths get 404.
location / {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
