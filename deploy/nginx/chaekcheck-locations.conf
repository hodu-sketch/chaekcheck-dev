# Locations shared by chaekcheck.conf (production example) and local-test.conf. The including server block sets
# `root` to the `web/dist` build output and defines `upstream chaekcheck_backend` (the Spring backend).

# JSON responses compressed (cycle 07, ADR-0058: the whole library list is sent at once, about 460KB). Responses come
# from the proxy, so gzip_proxied is needed. Search streams (text/event-stream) are not in gzip_types: never compressed.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/problem+json;

# Spring backend, same origin. Spring Security adds the API response headers while login is on.
location /api/ {
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# APIs that make the server call library sites (zones in rate-limits.conf, user request 2026-10-05):
# the search and holding streams (first batch and next batches) and the per-library "more" API. Over the limit: 429.
# The backend also caps the searches running at once over all users (chaekcheck.availability.max-concurrent-searches,
# 503 server_busy). Regex locations are checked in order, so this one comes before the general stream location.
location ~ ^/api/v1/(ebook-searches|book-availabilities)(/batches)?/stream$ {
    limit_req zone=chaekcheck_library_calls burst=20 nodelay;
    limit_conn chaekcheck_library_conns 6;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @library_calls_limited;
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # TODO(확인 필요): longest stream time; the batch deadline is 30s (application.yml).
    proxy_read_timeout 120s;
}
location ^~ /api/v1/availability/ {
    limit_req zone=chaekcheck_library_calls burst=20 nodelay;
    limit_conn chaekcheck_library_conns 6;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @library_calls_limited;
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# 429 from the limits above as Problem Details, like the backend's errors (code member, ADR-0008).
# Retry-After 2: one new request is allowed every 2s at rate=30r/m (rate-limits.conf) [안].
location @library_calls_limited {
    default_type application/problem+json;
    add_header Retry-After 2 always;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests from this address; try again shortly","code":"too_many_requests"}';
}

# Other streams (text/event-stream): pass each event on at once instead of buffering the body.
location ~ ^/api/v1/.+/stream$ {
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # TODO(확인 필요): longest stream time; the batch deadline is 30s (application.yml).
    proxy_read_timeout 120s;
}

# Screen routes of the web app (web/src/main.tsx) all get index.html; the app draws the screen.
location = / {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
# my-libraries was missing before cycle 07 (opening it directly gave 404); about is S12 (cycle 07).
location ~ ^/(search|signup|terms|privacy|about|my-libraries|auth/complete|books/[^/]+)$ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# Build files with a content hash in the name never change.
location /assets/ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Library logos (cycle 07, ADR-0059): file names have no content hash, so a long cache without immutable [안: 7 days].
# Taking a logo down does not depend on the cache: the API stops sending its logoUrl at once (logo_visible).
location /library-logos/ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

# Other files in dist (favicon, index.html itself). Unknown paths get 404.
location / {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
