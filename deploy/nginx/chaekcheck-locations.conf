# Locations shared by chaekcheck.conf (production example) and local-test.conf. The including server block sets
# `root` to the `web/dist` build output and defines `upstream chaekcheck_backend` (the Spring backend).

# JSON responses compressed (cycle 07, ADR-0058: the whole library list is sent at once, about 460KB). Responses come
# from the proxy, so gzip_proxied is needed. Search streams (text/event-stream) are not in gzip_types: never compressed.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/problem+json;

# Actuator endpoints must not be reachable from outside (cycle 27, ADR-0169).
# The backend exposes /actuator/health (readiness + liveness) for switch.sh, but nginx blocks all /actuator/ paths.
location ^~ /actuator/ {
    return 404;
}

# Spring backend, same origin. Spring Security adds the API response headers while login is on.
location /api/ {
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# APIs that make the server call library sites (zones in rate-limits.conf, user request 2026-10-05):
# the search and holding streams (first batch and next batches) and the per-library "more" API. Over the limit: 429.
# The backend also caps the searches running at once over all users (chaekcheck.availability.max-concurrent-searches,
# 503 server_busy). Regex locations are checked in order, so this one comes before the general stream location.
location ~ ^/api/v1/(ebook-searches|book-availabilities)(/batches)?/stream$ {
    # named robots never reach the backend (cycle 15, map in rate-limits.conf)
    if ($chaekcheck_named_bot) {
        return 403;
    }
    limit_req zone=chaekcheck_library_calls burst=20 nodelay;
    limit_conn chaekcheck_library_conns 6;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @library_calls_limited;
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # TODO(확인 필요): longest stream time; the batch deadline is 30s (application.yml).
    proxy_read_timeout 120s;
}
location ^~ /api/v1/availability/ {
    if ($chaekcheck_named_bot) {
        return 403;
    }
    limit_req zone=chaekcheck_library_calls burst=20 nodelay;
    limit_conn chaekcheck_library_conns 6;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @library_calls_limited;
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# 429 from the limits above as Problem Details, like the backend's errors (code member, ADR-0008).
# Retry-After 2: one new request is allowed every 2s at rate=30r/m (rate-limits.conf) [안].
location @library_calls_limited {
    default_type application/problem+json;
    add_header Retry-After 2 always;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests from this address; try again shortly","code":"too_many_requests"}';
}

# Usage reports from the web (cycle 15, ADR-0097): over the per-address limit nothing reaches the backend, and the
# answer is the same 204 as always, so the page never sees a difference.
location = /api/v1/usage-events {
    limit_req zone=chaekcheck_usage_events burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @usage_events_limited;
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
location @usage_events_limited {
    return 204;
}

# The AI search stream (POST, cycle 24): the same as the other streams below, and a body of at most 16 KB (the server
# refuses more too; the question, at most 5 earlier ones and the plan ids). At most about 21 s (5 s + 15 s). The body
# is never logged (default log format, request line only), and gzip is off for event streams.
location = /api/v1/ai-searches/stream {
    client_max_body_size 16k;
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
}

# Other streams (text/event-stream): pass each event on at once instead of buffering the body.
location ~ ^/api/v1/.+/stream$ {
    proxy_pass http://chaekcheck_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # TODO(확인 필요): longest stream time; the batch deadline is 30s (application.yml).
    proxy_read_timeout 120s;
}

# Screen routes of the web app (web/src/main.tsx) all get index.html; the app draws the screen.
location = / {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
# my-libraries was missing before cycle 07 (opening it directly gave 404); about is S12 (cycle 07); picks is S13 (cycle
# 14; cycle 10's /popular was never added, found when the site was opened through the tunnel on 2026-10-14); notices
# and notices/<number> are S16 and S17 (cycle 16). picks/<list> (cycle 21, /picks/librarian …) and account (마이페이지 >
# 계정) added 2026-10-18: opening a list directly gave 404 on chaekcheck.com. ai-search is S30, the AI book search
# conversation (cycle 24; the question is never in the address, ADR-0152). picks/for-you (cycle 23) needs the hyphen.
location ~ ^/(search|signup|terms|privacy|about|mypage|my-libraries|account|picks|picks/[a-z0-9-]+|notices|notices/[0-9]+|auth/complete|books/[^/]+|ai-search)$ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# Build files with a content hash in the name never change.
location /assets/ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Library logos (cycle 07, ADR-0059): file names have no content hash, so a long cache without immutable [안: 7 days].
# Taking a logo down does not depend on the cache: the API stops sending its logoUrl at once (logo_visible).
location /library-logos/ {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

# Other files in dist (favicon, robots.txt, index.html itself). Unknown paths get 404.
location / {
    include /etc/nginx/chaekcheck/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
