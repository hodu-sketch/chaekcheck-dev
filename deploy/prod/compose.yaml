# Zero-downtime deployment (cycle 27, ADR-0167/0168/0169).
# Two backend slots (blue/green): bin/switch.sh brings up the new slot, points nginx at it, and stops the old one.
# Web files: folder bind mount from /srv/chaekcheck/web/current (a symlink to releases/X.Y.Z).
# Lives in /srv/chaekcheck with slots.env (ACTIVE_SLOT, versions), secrets.env (from Parameter Store), prod.env.
#   bin/up.sh [service ...]          — start services (reads secrets, active slot)
#   bin/switch.sh backend X.Y.Z     — zero-downtime backend deploy
#   bin/switch.sh web X.Y.Z         — zero-downtime web deploy
# Ports are bound to 127.0.0.1 only; the public way in is the tunnel.

name: chaekcheck

x-backend: &backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  stop_grace_period: 60s
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chaekcheck
    DB_NAME: chaekcheck
    DB_USERNAME: chaekcheck
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing (Parameter Store through up.sh)}
    TZ: Asia/Seoul
    # Small heap for the 2GB server (plan 17: about -Xmx640m)
    JAVA_TOOL_OPTIONS: -Xmx640m -XX:+ExitOnOutOfMemoryError
    # Switches from prod.env (git, not secret): off by default; the go-live turns login and the usage log on (plan 17,
    # user decision 2026-10-18). Picks fetch stays off: the picks list is in the database already.
    # FETCH_MODE direct = no fetch-service.
    CHAEKCHECK_AUTH_ENABLED: ${CHAEKCHECK_AUTH_ENABLED:-false}
    CHAEKCHECK_PICKS_FETCH_ENABLED: "false"
    CHAEKCHECK_USAGELOG_ENABLED: ${CHAEKCHECK_USAGELOG_ENABLED:-false}
    # AI book search (cycle 24, ADR-0150): off until the privacy policy version naming Anthropic is in force and the
    # key is in Parameter Store (/chaekcheck/prod/CHAEKCHECK_AISEARCH_ANTHROPIC_API_KEY, read by up.sh). An empty key
    # with the search on gives the fallback answers (books without text).
    CHAEKCHECK_AISEARCH_ENABLED: ${CHAEKCHECK_AISEARCH_ENABLED:-false}
    CHAEKCHECK_AISEARCH_ANTHROPIC_API_KEY: ${CHAEKCHECK_AISEARCH_ANTHROPIC_API_KEY:-}
    # AI search question vectors (user 2026-10-25, docs/reports/ai-search-eval-2026-10-25.md): the int8 KURE-v1 model
    # and the book vectors from the PC in /srv/chaekcheck/aisearch-model (docs/maintenance/6-aisearch.md 7절), about
    # 450 MB outside the heap, most of it the model file read by mmap. Off until turned on in prod.env; a missing
    # folder leaves it off with one warning. DJL puts its tokenizer library under DJL_CACHE_DIR (the user has no home)
    CHAEKCHECK_AISEARCH_VECTOR_ENABLED: ${CHAEKCHECK_AISEARCH_VECTOR_ENABLED:-false}
    CHAEKCHECK_AISEARCH_MODEL_DIR: /models/aisearch
    # local = the model in this container; remote = the embedding server (embed-service/ on the micro EC2, its private
    # address in prod.env, the token from Parameter Store); with remote the folder needs book-vectors.bin only
    CHAEKCHECK_AISEARCH_VECTOR_ENCODER: ${CHAEKCHECK_AISEARCH_VECTOR_ENCODER:-local}
    CHAEKCHECK_AISEARCH_EMBED_URL: ${CHAEKCHECK_AISEARCH_EMBED_URL:-}
    CHAEKCHECK_AISEARCH_EMBED_TOKEN: ${CHAEKCHECK_AISEARCH_EMBED_TOKEN:-}
    # the first step (user 2026-10-26): haiku = the first Haiku call; ml = small networks over the question vector
    # (needs first-call-model.bin and book-profiles.tsv in the model folder; without them Haiku as before)
    CHAEKCHECK_AISEARCH_FIRST_CALL: ${CHAEKCHECK_AISEARCH_FIRST_CALL:-haiku}
    # how an ml follow-up is tied to the earlier question: relation (follow-up-model.bin; rule without it), rule, strict
    CHAEKCHECK_AISEARCH_FOLLOW_UP: ${CHAEKCHECK_AISEARCH_FOLLOW_UP:-relation}
    # the pick call's ask-back, and Haiku's thinking and prompt caching (user 2026-10-26; docs/maintenance/6-aisearch.md 10절)
    CHAEKCHECK_AISEARCH_PICK_ASK_BACK: ${CHAEKCHECK_AISEARCH_PICK_ASK_BACK:-false}
    CHAEKCHECK_AISEARCH_LLM_THINKING: ${CHAEKCHECK_AISEARCH_LLM_THINKING:-}
    CHAEKCHECK_AISEARCH_LLM_CACHE_SYSTEM: ${CHAEKCHECK_AISEARCH_LLM_CACHE_SYSTEM:-false}
    # two layers + BM25 (2026-10-31, docs/maintenance/6-aisearch.md 15): the ML first call's rulesOut, the keyword match
    # (like | bm25) and what the second call reads (line | summary); the defaults are the code's
    CHAEKCHECK_AISEARCH_RULES_OUT: ${CHAEKCHECK_AISEARCH_RULES_OUT:-true}
    CHAEKCHECK_AISEARCH_KEYWORD_MATCH: ${CHAEKCHECK_AISEARCH_KEYWORD_MATCH:-like}
    CHAEKCHECK_AISEARCH_READING_TEXT: ${CHAEKCHECK_AISEARCH_READING_TEXT:-line}
    DJL_CACHE_DIR: /tmp/djl
    # 나에게 맞는 책 (cycle 23): the start-up and 03:30 build of popular orders; off until turned on in prod.env
    # (user 2026-10-25 "수집 끄고 배포"), the tab then shows the listed books only
    CHAEKCHECK_FORYOU_BUILD_ENABLED: ${CHAEKCHECK_FORYOU_BUILD_ENABLED:-false}
    FETCH_MODE: direct
    # Login (Kakao only, cycle 05/16). Keys from Parameter Store; needed only when login is on.
    AUTH_PROVIDERS: kakao
    AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
    KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
    KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
    KAKAO_APP_ID: ${KAKAO_APP_ID:-}
    # Library lookups go out through the Webshare proxies only, never the server's own address (cycle 20 #24,
    # proxy-only). Webshare user and password (user decision 2026-10-18, the main way, sent preemptively on the first
    # CONNECT); empty values fall back to Webshare's IP Authorization of this server. The names are
    # the Parameter Store ones (/chaekcheck/prod/..., up.sh).
    CHAEKCHECK_AVAILABILITY_EGRESS_MODE: proxy-only
    CHAEKCHECK_AVAILABILITY_EGRESS_PROXIES: ${WEBSHARE_PROXIES:?WEBSHARE_PROXIES missing (Parameter Store through up.sh)}
    CHAEKCHECK_AVAILABILITY_EGRESS_PROXYVENDOR: webshare
    CHAEKCHECK_AVAILABILITY_EGRESS_PROXYUSERNAME: ${WEBSHARE_PROXY_USERNAME:-}
    CHAEKCHECK_AVAILABILITY_EGRESS_PROXYPASSWORD: ${WEBSHARE_PROXY_PASSWORD:-}
  volumes:
    - /srv/chaekcheck/aisearch-model:/models/aisearch:ro

services:
  db:
    image: chaekcheck/postgres-bigm:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: chaekcheck
      POSTGRES_USER: chaekcheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing (Parameter Store through up.sh)}
      # Korean time everywhere on the server (user 2026-10-19: "싹 다 한국시간으로"); timestamps are timestamptz, so
      # stored instants do not change, only how they are shown and logged
      TZ: Asia/Seoul
    # Same settings as the local compose.yaml defaults (cycle 08, ADR-0066). Measure again on this server.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_bigm,pg_search
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - timezone=Asia/Seoul
      - -c
      - log_timezone=Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql
      # restore file (deploy/test/README.md 6), read only
      - ./restore:/restore:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-blue:
    <<: *backend
    image: chaekcheck/backend:${BACKEND_BLUE_VERSION:?BACKEND_BLUE_VERSION missing (slots.env through up.sh)}
    networks:
      default:
        aliases:
          - backend-blue

  backend-green:
    <<: *backend
    image: chaekcheck/backend:${BACKEND_GREEN_VERSION:?BACKEND_GREEN_VERSION missing (slots.env through up.sh)}
    networks:
      default:
        aliases:
          - backend-green

  web:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    networks:
      default:
        # the tunnel route in the Cloudflare dashboard sends chaekcheck.com to http://nginx:80
        aliases:
          - nginx
    ports:
      - "127.0.0.1:8088:80"
    # Korean time in the nginx logs: the alpine image has no zone files, so it reads the server's (Asia/Seoul)
    environment:
      TZ: Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Folder bind mounts (ADR-0168): switch.sh writes active-backend.conf and the current symlink in place;
      # nginx sees the changes without a container restart.
      - /srv/chaekcheck/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/chaekcheck/nginx/chaekcheck:/etc/nginx/chaekcheck:ro
      - /srv/chaekcheck/web:/srv/chaekcheck/web:ro

  # Cloudflare Tunnel (ADR-0103): chaekcheck.com reaches nginx through an outbound connection, so the server opens no
  # port. Starting this service makes the site public. The token is TUNNEL_TOKEN in Parameter Store (raw eyJ... value).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    depends_on:
      - web
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN missing (Parameter Store through up.sh)}
      TZ: Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro

volumes:
  db-data:
