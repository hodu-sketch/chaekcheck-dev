plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chaekcheck'
// Semantic version of the release (user decision 2026-10-18: v1.0.0 is the first public release); bump it with
// deploy/prod/bin/release.sh, which tags the commit vX.Y.Z
version = '1.21.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Spring Modulith 2.1.x is built against Spring Boot 4.1.x
	set('springModulithVersion', '2.1.1')
	set('jsoupVersion', '1.23.2')
	// Collection import only (Maven Central latest 2026-09-30, Apache License 2.0)
	set('sqliteJdbcVersion', '3.53.4.0')
	// AI search question vectors (user 2026-10-25, docs/aisearch/reports/2026-10-25-eval.md): the int8 KURE-v1
	// query model runs in this process (Maven Central 2026-10-25; MIT and Apache License 2.0). Both jars carry their
	// native libraries for linux-aarch64 (the server) and win-x86_64 (this PC)
	set('onnxruntimeVersion', '1.31.0')
	set('djlTokenizersVersion', '0.38.0')
}

configurations {
	// The collection import reads the collection SQLite file through plain JDBC (ADR-0031). The driver is on the
	// bootRun and test classpaths only, never in bootJar (user decision 2026-09-30).
	collectionImport
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	// Login (cycle 05, user approved 2026-10-04). Active only with chaekcheck.auth.enabled=true; when it is off the
	// security auto-configurations are excluded (com.chaekcheck.auth.internal.AuthToggleEnvironmentPostProcessor).
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// Event publication registry for AccountDeleted (ADR-0041). Tables come from Liquibase (modulith schema).
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	// Version managed by Spring Boot
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation "org.jsoup:jsoup:${jsoupVersion}"
	// Library sites whose host name has an underscore (cycle 18, ADR-0111): java.net.http refuses such URIs, so
	// availability sends those requests with Apache HttpClient 5. Version managed by Spring Boot.
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	// implementation: the catalog load writes with the driver's CopyManager (PostgreSQL COPY)
	implementation 'org.postgresql:postgresql'
	implementation "com.microsoft.onnxruntime:onnxruntime:${onnxruntimeVersion}"
	implementation "ai.djl.huggingface:tokenizers:${djlTokenizersVersion}"
	collectionImport "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"
	testRuntimeOnly "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

// META-INF/build-info.properties: version and the short commit hash, read by GET /api/v1/version
springBoot {
	buildInfo {
		properties {
			additional = [commit: gitCommit()]
		}
	}
}

def gitCommit() {
	try {
		return providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }.standardOutput.asText.get().trim()
	}
	catch (Exception ignored) {
		return 'unknown'
	}
}

// One jar name for every version, so backend/Dockerfile copies the same file
tasks.named('bootJar') {
	archiveFileName = 'chaekcheck.jar'
}

tasks.named('bootRun') {
	classpath += configurations.collectionImport
	// Heap (cycle 08 step 9, user choice 2026-10-11): the service measured fine at 256m; 512m leaves room for many
	// searches at once. The import needs more: ./gradlew bootRun -PbootRunXmx=2g ... with the default compact grouping,
	// 6g only for the objects grouping (docs/maintenance/3-import.md)
	jvmArgs "-Xmx${project.findProperty('bootRunXmx') ?: '512m'}"
	// Cycle 11 measurement (ADR-0079): more JVM options, split at spaces, e.g.
	// -PbootRunJvmArgs="-XX:+UseStringDeduplication -XX:+UseCompactObjectHeaders -Xlog:gc*:file=../data/cycle11/gc.log"
	def extraJvmArgs = project.findProperty('bootRunJvmArgs')
	if (extraJvmArgs) {
		jvmArgs extraJvmArgs.toString().trim().split(/\s+/)
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Tests use the db-test service from ../compose.yaml (see application-test.yml)
	systemProperty 'spring.profiles.active', 'test'
}
