spring:
  datasource:
    url: jdbc:postgresql://localhost:${TEST_DB_PORT:5433}/${TEST_DB_NAME}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    hikari:
      # Spring keeps one context per test configuration, each with its own pool. With the default 10 connections
      # per pool, the auth tests (several login on/off configurations) passed PostgreSQL's 100-connection limit.
      maximum-pool-size: 4

chaekcheck:
  aisearch:
    llm:
      anthropic:
        # Tests never call the real API, even when the session has a key in the environment
        api-key: ""
  auth:
    # Tests set login on per class; the local ../.env (which may switch login on or offer kakao only while trying a
    # provider) must not change them. Real environment variables still win over these.
    enabled: false
    providers: naver,kakao
  # Tests never build the for-you list on their own; a class that tests the build calls it (cycle 23)
  foryou:
    build:
      enabled: false
  picks:
    fetch:
      # Tests never call the real API or covers (plan cycle 14 C3). A class that tests the fetch turns it on for
      # itself and brings a fake transport. No key: a test that needs one sets it.
      enabled: false
      api-key: ""
  availability:
    ops-sample:
      # Off in tests: no 10-second rows in db-test; LookupSamplePartitionTests calls the store directly
      enabled: false
  usagelog:
    # Off in tests, whatever ../.env says; a class that tests the log turns it on for itself (cycle 15)
    enabled: false
