# sitecontent module (cycle 16; ADR-0098): notices and the four documents (about, terms of service, privacy policy,
# privacy collection notice), every version kept. A version is never edited: a new one is inserted with the next
# number (1, 2, ...) per notice or document. The current version is the one with the highest number whose
# effective_on is on or before today (Asia/Seoul). Written by operations SQL only; the REST API reads.
# No updated_at column, so no trigger. No foreign key or join to other modules (auth keeps the version number only).
# CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no CHECK). "Not blank" trims spaces, tabs
# and line breaks (btrim alone trims spaces only, so a body of line breaks would pass).
databaseChangeLog:
  - changeSet:
      id: sitecontent-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA sitecontent

  - changeSet:
      id: sitecontent-001-notice
      author: chaekcheck
      changes:
        # pinned: only at the top of page 1, left out of the ten per page and of the total count.
        # hidden: kept in the database, 404 in the list and at its address.
        - sql:
            sql: >-
              CREATE TABLE sitecontent.notice (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT notice_pkey PRIMARY KEY,
                pinned boolean NOT NULL DEFAULT false,
                hidden boolean NOT NULL DEFAULT false,
                created_at timestamp with time zone NOT NULL DEFAULT now()
              )

  - changeSet:
      id: sitecontent-001-notice-version
      author: chaekcheck
      changes:
        # version 1's effective_on is the posting day, later versions' the day it was edited. A future day shows the
        # version from that day on. No other index: the list reads all visible notices (few); add a partial index
        # WHERE NOT hidden when the plan shows it is needed.
        - sql:
            sql: >-
              CREATE TABLE sitecontent.notice_version (
                notice_id bigint NOT NULL
                  CONSTRAINT notice_version_notice_id_fkey REFERENCES sitecontent.notice (id),
                version_no integer NOT NULL CONSTRAINT notice_version_version_no_check CHECK (version_no >= 1),
                effective_on date NOT NULL,
                title text NOT NULL CONSTRAINT notice_version_title_check CHECK (btrim(title, E' \t\r\n') <> ''),
                body text NOT NULL CONSTRAINT notice_version_body_check CHECK (btrim(body, E' \t\r\n') <> ''),
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                CONSTRAINT notice_version_pkey PRIMARY KEY (notice_id, version_no)
              )

  - changeSet:
      id: sitecontent-001-document-version
      author: chaekcheck
      changes:
        # change_summary: what changed, written by a person; never on ABOUT.
        # consent_items: the four rows of the privacy collection notice (purpose, items, retention, right to refuse),
        # [{label, text}], on PRIVACY_COLLECTION only.
        - sql:
            sql: >-
              CREATE TABLE sitecontent.document_version (
                document_key text NOT NULL CONSTRAINT document_version_document_key_check
                  CHECK (document_key IN ('ABOUT', 'TERMS_OF_SERVICE', 'PRIVACY_POLICY', 'PRIVACY_COLLECTION')),
                version_no integer NOT NULL CONSTRAINT document_version_version_no_check CHECK (version_no >= 1),
                effective_on date NOT NULL,
                body text NOT NULL CONSTRAINT document_version_body_check CHECK (btrim(body, E' \t\r\n') <> ''),
                change_summary text,
                consent_items jsonb,
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                CONSTRAINT document_version_pkey PRIMARY KEY (document_key, version_no),
                CONSTRAINT document_version_change_summary_check
                  CHECK (document_key <> 'ABOUT' OR change_summary IS NULL),
                CONSTRAINT document_version_consent_items_check
                  CHECK ((document_key = 'PRIVACY_COLLECTION') = (consent_items IS NOT NULL)),
                CONSTRAINT document_version_consent_items_shape_check
                  CHECK (consent_items IS NULL
                    OR (jsonb_typeof(consent_items) = 'array' AND jsonb_array_length(consent_items) = 4))
              )
