# sitecontent module (cycle 16; ADR-0098, ADR-0099): version 1 of the four documents. No notice (the first notice is
# put in on the opening day with the operator SQL, docs/maintenance/5-sitecontent.md 1).
# Cycle 17 (2026-10-18, before the first deployment, while PRE_DEPLOYMENT exists): the placeholders were replaced by
# the approved minimal drafts, plan docs/cycles/16-notices-and-policies/drafts/ (terms-of-service.md,
# privacy-collection.md, privacy-policy.md 9th, about.md), the body after each file's <!-- --> note; the plan note
# on the privacy policy's section 4 contact line is left out. effective_on is the public opening day 2026-10-18.
# The consent records keep version '1' (auth/002). Same day, user request: the privacy policy's withdrawal line says
# "로그인한 뒤" and its last line no longer points at earlier versions (there are none yet); then 탈퇴 moved to
# 마이페이지 > 계정, so the line names that place.
# Bodies are dollar-quoted ($$...$$) and splitStatements: false, so semicolons in the text never split a statement.
databaseChangeLog:
  - changeSet:
      id: sitecontent-002-terms-of-service
      author: chaekcheck
      changes:
        - sql:
            splitStatements: false
            sql: |-
              INSERT INTO sitecontent.document_version (document_key, version_no, effective_on, body)
              VALUES ('TERMS_OF_SERVICE', 1, DATE '2026-10-18', $$## 1. 서비스
              책첵은 전자도서관의 공개 검색 결과를 모아 보여 주는 무료 서비스입니다. 대출은 각 도서관에서 하며, 보여 주는 수량은 실제와 잠시 다를 수 있습니다.

              ## 2. 회원
              만 14세 이상이 카카오로 가입할 수 있고, 설정에서 언제든 탈퇴할 수 있습니다.

              ## 3. 이용 제한
              서비스 운영을 방해하면 이용을 막을 수 있습니다.

              ## 4. 약관 변경
              바꿀 때는 공지사항으로 알리고, 중요한 변경은 다시 동의를 받습니다.

              이 약관은 2026-10-18부터 적용됩니다.$$)

  - changeSet:
      id: sitecontent-002-privacy-collection
      author: chaekcheck
      changes:
        - sql:
            splitStatements: false
            sql: |-
              INSERT INTO sitecontent.document_version (document_key, version_no, effective_on, body, consent_items)
              VALUES ('PRIVACY_COLLECTION', 1, DATE '2026-10-18', $$위 정보만 받으며, 탈퇴하면 바로 지웁니다.$$, $$[
                {"label": "목적", "text": "로그인 유지, 내 지역 도서관 찾기"},
                {"label": "항목", "text": "카카오 회원 식별 번호, 거주·직장 지역, 직접 추가한 도서관"},
                {"label": "보유 기간", "text": "탈퇴 또는 마지막 로그인 뒤 1년"},
                {"label": "거부할 권리", "text": "동의하지 않으면 가입할 수 없지만, 검색은 그대로 쓸 수 있어요"}
              ]$$::jsonb)

  - changeSet:
      id: sitecontent-002-privacy-policy
      author: chaekcheck
      changes:
        - sql:
            splitStatements: false
            sql: |-
              INSERT INTO sitecontent.document_version (document_key, version_no, effective_on, body)
              VALUES ('PRIVACY_POLICY', 1, DATE '2026-10-18', $$## 1. 수집 항목, 목적, 보유 기간

              - **가입한 경우**: 카카오 회원 식별 번호, 거주·직장 지역, 직접 추가한 도서관
                - 목적: 로그인 유지, 도서관 찾기
                - 보유 기간: 탈퇴 또는 마지막 로그인 뒤 1년
              - **자동으로 수집되는 정보**: IP 주소, 브라우저 종류, 접속 기록, 서비스 이용 기록(로그인한 경우 회원 번호 포함), 부정 이용 기록
                - 목적: 이용 통계, 운영과 보안, 책 추천
                - 보유 기간: 1년 (IP 주소·부정 이용 기록 30일, 접속 기록 14일). 회원 번호는 탈퇴하면 바로 지움

              기간이 지나거나 탈퇴하면 바로 지웁니다. 지운 정보는 백업에 7일 동안 남았다가 지워집니다. 개인정보를 제3자에게 제공하지 않습니다.

              ## 2. 처리 위탁과 국외 이전

              - **Amazon Web Services**
                - 맡긴 일: 서버·데이터 보관
                - 나라: 호주
                - 보유 기간: 위 1과 같음
              - **Cloudflare, Inc.**
                - 맡긴 일: 웹 요청 전달·보안
                - 나라: 미국 및 Cloudflare 네트워크가 있는 나라
                - 옮기는 항목과 방법: IP 주소, 요청 정보 / 접속할 때 네트워크로 전송
                - 보유 기간: 업무에 필요한 기간 동안 보관하고, 기간이 지나면 지웁니다

              국외 이전이나 개인정보에 관한 문의는 아래 4절의 담당자에게 하면 됩니다. 국외 이전을 원하지 않으면 서비스를 쓰지 않으면 됩니다(거부하면 접속·가입할 수 없습니다).

              ## 3. 쿠키

              로그인 유지와 로그인 상태 확인용 쿠키, 요청 위조를 막는 보안 쿠키를 씁니다. 이 밖의 기록용 쿠키는 쓰지 않습니다. 브라우저에서 막을 수 있으며, 막으면 로그인을 쓸 수 없습니다.

              ## 4. 권리, 안전 조치, 문의

              - 내 정보의 열람·정정·삭제·처리정지를 아래로 요청하거나, 로그인한 뒤 마이페이지 계정의 「탈퇴하기」로 바로 지울 수 있습니다.
              - 개인정보에 접근할 수 있는 사람을 제한하고, 주고받는 구간을 암호화하며, 비밀값을 암호화해 보관합니다.
              - 개인정보 보호 담당: 책첵 운영자, <chaekcheck9104@gmail.com>

              이 방침은 2026-10-18부터 적용됩니다. 바꿀 때는 공지사항으로 알립니다.$$)

  - changeSet:
      id: sitecontent-002-about
      author: chaekcheck
      changes:
        - sql:
            splitStatements: false
            sql: |-
              INSERT INTO sitecontent.document_version (document_key, version_no, effective_on, body)
              VALUES ('ABOUT', 1, DATE '2026-10-18', $$책첵은 여러 전자도서관에서 지금 빌릴 수 있는 전자책을 한 번에 찾아 주는 서비스예요.

              사서추천도서 목록과 일부 표지는 국립중앙도서관 자료(공공누리 제1유형)예요.

              각 도서관의 로고와 이름은 그 기관의 것이며 책첵은 제휴·후원 관계가 없습니다.

              문의: <chaekcheck9104@gmail.com>

              만든 사람: <https://github.com/hodu-sketch/chaekcheck-about>$$)
