# foryou module (cycle 23; ADR-0148, ADR-0149): the 「나에게 맞는 책」 tab. Daily build runs and their rows (popular
# lists, scores, the base list of 40), and what the crawl PC computes and the import carries: book neighbours (one row
# per book, integer[] of at most 20, ADR-0149), tab blurbs and cover file keys. No foreign key or join to other modules:
# books and libraries are matched by value (bookId, libraryId). foryou.book_neighbour_next is made and dropped by the
# neighbours import, so it is not here. CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no
# CHECK).
databaseChangeLog:
  - changeSet:
      id: foryou-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA foryou

  - changeSet:
      id: foryou-001-build-run
      author: chaekcheck
      changes:
        # One row per daily build (Asia/Seoul date). note: per source rows read, matched and whether it was left out
        # (to-dev-popular-list-check.md 2). A running row left by a crash is made failed at start.
        - sql:
            sql: >-
              CREATE TABLE foryou.build_run (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT build_run_pkey PRIMARY KEY,
                built_on date NOT NULL,
                started_at timestamp with time zone NOT NULL,
                finished_at timestamp with time zone,
                status text NOT NULL CONSTRAINT build_run_status_check
                  CHECK (status IN ('running', 'succeeded', 'failed')),
                note text
              )
        # the last succeeded build is read at start and every 10 minutes
        - sql:
            sql: CREATE INDEX build_run_status_built_on_idx ON foryou.build_run (status, built_on DESC)

  - changeSet:
      id: foryou-001-popular-row
      author: chaekcheck
      changes:
        # The rows each source gave, before and after matching to our books (weight tuning R2-3a reads them).
        # site_library_id: library.id of the e-library site (kyobo_elib, yes24_elib), null for the other sources.
        - sql:
            sql: >-
              CREATE TABLE foryou.popular_row (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT popular_row_pkey PRIMARY KEY,
                run_id bigint NOT NULL
                  CONSTRAINT popular_row_run_id_fkey REFERENCES foryou.build_run (id) ON DELETE CASCADE,
                source text NOT NULL CONSTRAINT popular_row_source_check
                  CHECK (source IN ('kyobo_elib', 'yes24_elib', 'kpipa_rank', 'kpipa_200', 'klwave')),
                site_library_id bigint,
                period text CONSTRAINT popular_row_period_check CHECK (period IN ('day', 'week', 'month', 'quarter')),
                rank smallint NOT NULL CONSTRAINT popular_row_rank_check CHECK (rank >= 1),
                loans_now integer CONSTRAINT popular_row_loans_now_check CHECK (loans_now >= 0),
                reservations integer CONSTRAINT popular_row_reservations_check CHECK (reservations >= 0),
                title text NOT NULL,
                author text,
                publisher text,
                isbn13 text,
                book_id bigint
              )
        - sql:
            sql: CREATE INDEX popular_row_run_id_idx ON foryou.popular_row (run_id)

  - changeSet:
      id: foryou-001-book-score
      author: chaekcheck
      changes:
        # The score of a group of editions, on its representative edition only (ADR-0149)
        - sql:
            sql: >-
              CREATE TABLE foryou.book_score (
                run_id bigint NOT NULL
                  CONSTRAINT book_score_run_id_fkey REFERENCES foryou.build_run (id) ON DELETE CASCADE,
                book_id bigint NOT NULL,
                score real NOT NULL CONSTRAINT book_score_score_check CHECK (score >= 0),
                CONSTRAINT book_score_pkey PRIMARY KEY (run_id, book_id)
              )

  - changeSet:
      id: foryou-001-base-entry
      author: chaekcheck
      changes:
        # The base list of a build in order (R2-4): at most 40 books, each once
        - sql:
            sql: >-
              CREATE TABLE foryou.base_entry (
                run_id bigint NOT NULL
                  CONSTRAINT base_entry_run_id_fkey REFERENCES foryou.build_run (id) ON DELETE CASCADE,
                position smallint NOT NULL CONSTRAINT base_entry_position_check CHECK (position BETWEEN 1 AND 40),
                book_id bigint NOT NULL,
                from_popular boolean NOT NULL,
                CONSTRAINT base_entry_pkey PRIMARY KEY (run_id, position),
                CONSTRAINT base_entry_run_id_book_id_key UNIQUE (run_id, book_id)
              )

  - changeSet:
      id: foryou-001-book-neighbour
      author: chaekcheck
      changes:
        # The 20 nearest books of a book, nearest first (KURE-v1 on the crawl PC, R6-1). 4-byte ids (ADR-0149): the
        # import refuses a book id above 2,147,483,647, the book itself and repeated ids.
        - sql:
            sql: >-
              CREATE TABLE foryou.book_neighbour (
                book_id bigint CONSTRAINT book_neighbour_pkey PRIMARY KEY,
                neighbour_ids integer[] NOT NULL CONSTRAINT book_neighbour_neighbour_ids_check
                  CHECK (cardinality(neighbour_ids) BETWEEN 1 AND 20 AND array_ndims(neighbour_ids) = 1),
                computed_on date NOT NULL
              )

  - changeSet:
      id: foryou-001-book-blurb
      author: chaekcheck
      changes:
        # The tab blurb the crawl PC's Haiku batch wrote (80-150 characters is the PC's rule, R8-4)
        - sql:
            sql: >-
              CREATE TABLE foryou.book_blurb (
                book_id bigint CONSTRAINT book_blurb_pkey PRIMARY KEY,
                blurb text NOT NULL CONSTRAINT book_blurb_blurb_check CHECK (char_length(blurb) BETWEEN 1 AND 300),
                made_on date NOT NULL
              )

  - changeSet:
      id: foryou-001-book-cover
      author: chaekcheck
      changes:
        # nginx serves /covers/<file_key>.jpg from the files the PC copied (ADR-0148)
        - sql:
            sql: >-
              CREATE TABLE foryou.book_cover (
                book_id bigint CONSTRAINT book_cover_pkey PRIMARY KEY,
                file_key text NOT NULL CONSTRAINT book_cover_file_key_check CHECK (file_key ~ '^[0-9a-f]{40}$')
              )
