# picks module (cycle 14; ADR-0089, ADR-0091): the National Library of Korea's librarian picks (사서추천도서), the
# latest six recommendation months, fetched once a week, and their covers made 200px JPEG. Replaces popular/001
# (cycle 10), which was removed before the first deployment (PRE_DEPLOYMENT rule, ADR-0089). No foreign key or join to
# other modules: catalog books are matched by value when the cache is built (ADR-0090). pick and cover are matched by
# cover_source = source_url, no foreign key (covers are cleaned up by the fetch). No updated_at column, so no trigger.
# CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no CHECK); splitStatements: false where a
# string literal could hold a semicolon (plan cycle 09 retro).
databaseChangeLog:
  - changeSet:
      id: picks-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA picks

  - changeSet:
      id: picks-001-fetch-run
      author: chaekcheck
      changes:
        # One row per fetch. SUCCEEDED rows are written in the list's transaction, FAILED rows alone; only the cover
        # and request counts are updated later. failure_detail holds an HTTP status or API error code only: never the
        # key, the request URL or a response body (spec R1-7).
        - sql:
            splitStatements: false
            sql: >-
              CREATE TABLE picks.fetch_run (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT fetch_run_pkey PRIMARY KEY,
                trigger text NOT NULL CONSTRAINT fetch_run_trigger_check
                  CHECK (trigger IN ('STARTUP', 'SCHEDULED', 'RETRY', 'CATCH_UP')),
                started_at timestamp with time zone NOT NULL,
                finished_at timestamp with time zone NOT NULL,
                status text NOT NULL CONSTRAINT fetch_run_status_check CHECK (status IN ('SUCCEEDED', 'FAILED')),
                failure_reason text CONSTRAINT fetch_run_failure_reason_check CHECK (failure_reason IN
                  ('key_missing', 'network_error', 'request_rejected', 'format_changed', 'incomplete', 'no_books')),
                failure_detail text,
                changed boolean,
                request_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_request_count_check CHECK (request_count >= 0),
                received_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_received_count_check CHECK (received_count >= 0),
                kept_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_kept_count_check CHECK (kept_count >= 0),
                missing_isbn_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_missing_isbn_count_check CHECK (missing_isbn_count >= 0),
                new_category_codes text,
                cover_fetched_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_cover_fetched_count_check CHECK (cover_fetched_count >= 0),
                cover_failed_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_cover_failed_count_check CHECK (cover_failed_count >= 0),
                CONSTRAINT fetch_run_failure_reason_status_check
                  CHECK ((status = 'FAILED') = (failure_reason IS NOT NULL)),
                CONSTRAINT fetch_run_changed_status_check CHECK ((status = 'SUCCEEDED') = (changed IS NOT NULL))
              )
        # the fetch decision and the "받은 날" read the latest runs by status
        - sql:
            sql: CREATE INDEX fetch_run_status_started_at_idx ON picks.fetch_run (status, started_at)

  - changeSet:
      id: picks-001-pick
      author: chaekcheck
      changes:
        # recom_no: 1~4 digits for old picks, 20 digits for recent ones (2026-10-12 test), so text. dr_code is not
        # tied to the known codes, so a new field does not stop the fetch (ADR-0089). cover_source: the API's
        # recomfilepath made https, NULL when it is not on www.nl.go.kr/afile/ (ADR-0091).
        - sql:
            splitStatements: false
            sql: >-
              CREATE TABLE picks.pick (
                recom_no text CONSTRAINT pick_pkey PRIMARY KEY
                  CONSTRAINT pick_recom_no_check CHECK (recom_no ~ '^[0-9]{1,20}$'),
                dr_code text NOT NULL CONSTRAINT pick_dr_code_check CHECK (length(dr_code) BETWEEN 1 AND 20),
                dr_code_name text,
                recom_month date NOT NULL
                  CONSTRAINT pick_recom_month_check CHECK (EXTRACT(DAY FROM recom_month) = 1),
                registered_on date,
                title text NOT NULL,
                author text,
                publisher text,
                isbn13 text CONSTRAINT pick_isbn13_check CHECK (isbn13 ~ '^97[89][0-9]{10}$'),
                cover_source text
                  CONSTRAINT pick_cover_source_check CHECK (cover_source LIKE 'https://www.nl.go.kr/afile/%')
              )

  - changeSet:
      id: picks-001-cover
      author: chaekcheck
      changes:
        # One 200px JPEG per source address, served at /api/v1/picks/covers/{id} (ADR-0091).
        - sql:
            sql: >-
              CREATE TABLE picks.cover (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT cover_pkey PRIMARY KEY,
                source_url text NOT NULL CONSTRAINT cover_source_url_key UNIQUE,
                content_type text NOT NULL,
                image bytea NOT NULL,
                byte_size integer NOT NULL CONSTRAINT cover_byte_size_check CHECK (byte_size >= 0),
                fetched_at timestamp with time zone NOT NULL
              )
