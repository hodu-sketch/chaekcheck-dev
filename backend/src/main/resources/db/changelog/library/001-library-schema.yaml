# library module: schema and tables (ADR-0002, ADR-0013, ADR-0016, ADR-0017).
# One e-library site = one library row. base_url is the site root the adapter appends its path to (origin for
# KYOBO/YES24/subscription/Gangnam sites, ".../elib" for portals), the final address after redirects.
# platform_type names carry a generation number (user decision 2026-09-28).
# eligibility_rule.scope_region_id holds a region module id only: no foreign key across modules.
# CHECK constraints and UNIQUE NULLS NOT DISTINCT are not available in Liquibase OSS YAML, so they use sql changes.
databaseChangeLog:
  - changeSet:
      id: library-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA library

  - changeSet:
      id: library-001-library
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE library.library (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT library_pkey PRIMARY KEY,
                name text NOT NULL CONSTRAINT library_name_key UNIQUE,
                library_type text NOT NULL DEFAULT 'EBOOK'
                  CONSTRAINT library_library_type_check CHECK (library_type IN ('EBOOK')),
                platform_type text
                  CONSTRAINT library_platform_type_check CHECK (platform_type IN
                    ('KYOBO_V1', 'KYOBO_SUBSCRIPTION_V1', 'YES24_V1', 'YES24_V2', 'YES24_V3', 'ELIB_PORTAL_V1',
                     'GANGNAM_V1')),
                base_url text CONSTRAINT library_base_url_key UNIQUE,
                eligibility_summary text,
                extra_condition_text text,
                visit_required boolean NOT NULL DEFAULT false,
                join_method text NOT NULL,
                join_url text,
                join_caution text,
                join_notice text,
                homepage_url text,
                holdings_count integer CONSTRAINT library_holdings_count_check CHECK (holdings_count >= 0),
                holdings_counted_on date,
                deferred boolean NOT NULL DEFAULT false,
                enabled boolean NOT NULL DEFAULT true,
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                updated_at timestamp with time zone NOT NULL DEFAULT now(),
                CONSTRAINT library_ebook_site_check CHECK (
                  library_type <> 'EBOOK' OR (platform_type IS NOT NULL AND base_url IS NOT NULL)),
                CONSTRAINT library_holdings_counted_check CHECK (
                  (holdings_count IS NULL) = (holdings_counted_on IS NULL))
              )

  - changeSet:
      id: library-001-eligibility-rule
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE library.eligibility_rule (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT eligibility_rule_pkey PRIMARY KEY,
                library_id bigint NOT NULL
                  CONSTRAINT eligibility_rule_library_id_fkey REFERENCES library.library (id) ON DELETE CASCADE,
                basis text NOT NULL
                  CONSTRAINT eligibility_rule_basis_check CHECK (basis IN ('RESIDENCE', 'WORK', 'SCHOOL', 'AFFILIATION')),
                scope_type text NOT NULL
                  CONSTRAINT eligibility_rule_scope_type_check CHECK (scope_type IN ('REGION', 'INSTITUTION', 'NATIONWIDE')),
                scope_region_id bigint,
                scope_institution_id bigint,
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                CONSTRAINT eligibility_rule_scope_check CHECK (
                  (scope_type = 'REGION' AND scope_region_id IS NOT NULL AND scope_institution_id IS NULL)
                  OR (scope_type = 'INSTITUTION' AND scope_institution_id IS NOT NULL AND scope_region_id IS NULL)
                  OR (scope_type = 'NATIONWIDE' AND scope_region_id IS NULL AND scope_institution_id IS NULL)),
                CONSTRAINT eligibility_rule_scope_key
                  UNIQUE NULLS NOT DISTINCT (library_id, basis, scope_type, scope_region_id, scope_institution_id)
              )
        - createIndex:
            schemaName: library
            tableName: eligibility_rule
            indexName: eligibility_rule_library_id_idx
            columns:
              - column:
                  name: library_id
