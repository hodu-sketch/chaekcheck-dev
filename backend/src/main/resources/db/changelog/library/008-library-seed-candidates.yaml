# Candidate libraries from the collection DB copy of 2026-10-05 07:45 (ADR-0052, ADR-0053).
# Both CSVs are made by scripts/library/build_candidate_seed.py; do not edit them by hand. Rules, counts and the
# libraries left out are in docs/library-maintenance.md 13절 (2026-10-05) and docs/library-site-issues.md 8절.
# Service ids continue after the registered libraries (281..2674); the collection ids they come from are in
# collection/002-collection-link.csv.
databaseChangeLog:
  - changeSet:
      id: library-008-seed-candidates
      author: chaekcheck
      changes:
        - loadData:
            schemaName: library
            tableName: library
            file: 008-library-candidates.csv
            relativeToChangelogFile: true
            encoding: UTF-8
            separator: ","
            usePreparedStatements: true
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: name, type: STRING }
              - column: { name: platform_type, type: STRING }
              - column: { name: base_url, type: STRING }
              - column: { name: eligibility_summary, type: STRING }
              - column: { name: extra_condition_text, type: STRING }
              - column: { name: visit_required, type: BOOLEAN }
              - column: { name: join_method, type: STRING }
              - column: { name: join_url, type: STRING }
              - column: { name: join_caution, type: STRING }
              - column: { name: join_notice, type: STRING }
              - column: { name: homepage_url, type: STRING }
              - column: { name: holdings_count, type: NUMERIC }
              - column: { name: holdings_counted_on, type: DATE }
              - column: { name: deferred, type: BOOLEAN }
              - column: { name: join_survey, type: STRING }
              - column: { name: lending_model, type: STRING }
        - loadData:
            schemaName: library
            tableName: eligibility_rule
            file: 008-eligibility-rule-candidates.csv
            relativeToChangelogFile: true
            encoding: UTF-8
            separator: ","
            usePreparedStatements: true
            columns:
              - column: { name: library_id, type: NUMERIC }
              - column: { name: basis, type: STRING }
              - column: { name: scope_type, type: STRING }
              - column: { name: scope_region_id, type: NUMERIC }
        - sql:
            sql: ALTER TABLE library.library ALTER COLUMN id RESTART WITH 2675

  - changeSet:
      id: library-008-registered-lending-model
      author: chaekcheck
      comment: >-
        Registered KYOBO subscription-screen libraries found in the KYOBO institution probe of 2026-10-03
        (model 소장 OWNED, 혼합 MIXED, 대여 RENTAL), printed by build_candidate_seed.py. The other 5 are not in the
        probe and keep NULL.
      changes:
        - sql:
            sql: >-
              UPDATE library.library l SET lending_model = v.model
              FROM (VALUES (7, 'RENTAL'), (16, 'RENTAL'), (19, 'OWNED'), (37, 'RENTAL'), (43, 'RENTAL'), (56, 'OWNED'),
                           (58, 'OWNED'), (63, 'MIXED'), (69, 'OWNED'), (89, 'RENTAL'), (110, 'OWNED'), (121, 'RENTAL'),
                           (122, 'RENTAL'), (129, 'RENTAL'), (134, 'RENTAL'), (158, 'MIXED')) AS v (id, model)
              WHERE l.id = v.id
