# Candidate libraries (cycle 07, ADR-0052, ADR-0053, ADR-0056).
# join_survey: how far the join rules were researched. MEMBERS_ONLY and NOT_SURVEYED libraries are planned only when
# the user added them; their join_method may be NULL (no join research).
# lending_model: lending kind of a KYOBO subscription-screen institution (from the KYOBO institution probe); NULL
# keeps the platform's own rule. OWNED shows counts instead of "구독형 · 바로 대출" (ADR-0056).
# CHECK constraints use sql changes (Liquibase OSS YAML has no CHECK).
databaseChangeLog:
  - changeSet:
      id: library-007-candidates-schema
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              ALTER TABLE library.library
                ADD COLUMN join_survey text NOT NULL DEFAULT 'SURVEYED'
                  CONSTRAINT library_join_survey_check CHECK (join_survey IN
                    ('SURVEYED', 'NOT_FOUND', 'MEMBERS_ONLY', 'NOT_SURVEYED')),
                ADD COLUMN lending_model text
                  CONSTRAINT library_lending_model_check CHECK (lending_model IN
                    ('OWNED', 'SUBSCRIPTION', 'MIXED', 'RENTAL')),
                ALTER COLUMN join_method DROP NOT NULL,
                ADD CONSTRAINT library_join_method_check CHECK (join_survey <> 'SURVEYED' OR join_method IS NOT NULL),
                DROP CONSTRAINT library_platform_type_check,
                ADD CONSTRAINT library_platform_type_check CHECK (platform_type IN
                  ('KYOBO_V1', 'KYOBO_SUBSCRIPTION_V1', 'YES24_V1', 'YES24_V2', 'YES24_V3', 'ELIB_PORTAL_V1',
                   'GANGNAM_V1', 'BOOKCUBE_FX', 'ALADIN_V1'))
