# cycle 09 (ADR-0071, ADR-0076): a library name is the body's name only; vendor, lending_model and order_no tell
# sites of the same body apart. One changeSet on purpose: PostgreSQL rolls DDL back too, so if the UNIQUE at the end
# fails, nothing of this stays and the start stops (plan cycle 09 design-delta, user decision 2026-10-11).
# Names: scripts/library/name_overrides.tsv (vendor and lending labels removed: label-removed; renames checked against
# official sources, docs/library-maintenance.md 4-13), turned into VALUES by
# `build_candidate_seed.py --changes-only` from the local db after 013. So old_name is the name after 013 (434, 456
# carry the " (북큐브)" 013 gave them), and a row whose name is no longer the old one is left alone.
# lending_model now covers every library but the portal (ELIB_PORTAL_V1, NULL); 001 says "KYOBO subscription-screen
# institutions only", which this changeset replaces. Only NULL rows are filled, so no KYOBO subscription row gets a
# new OWNED and the holding verdict stays (HoldingTask, plan cycle 09 C5).
# The applied seed files are not edited (plan cycle 09 C2); this is folded into the seed at the clean-up just before
# the first deployment, when vendor and order_no become seed columns.
