        - sql:
            sql: >-
              ALTER TABLE library.library ADD COLUMN vendor text
              CONSTRAINT library_vendor_check CHECK (vendor IN ('KYOBO', 'YES24', 'BOOKCUBE', 'ALADIN', 'PORTAL', 'IN_HOUSE'))
        # same table as build_candidate_seed.py VENDORS
        - sql:
            sql: >-
              UPDATE library.library SET vendor = CASE platform_type
                WHEN 'KYOBO_V1' THEN 'KYOBO' WHEN 'KYOBO_SUBSCRIPTION_V1' THEN 'KYOBO'
                WHEN 'YES24_V1' THEN 'YES24' WHEN 'YES24_V2' THEN 'YES24' WHEN 'YES24_V3' THEN 'YES24'
                WHEN 'BOOKCUBE_FX' THEN 'BOOKCUBE' WHEN 'ALADIN_V1' THEN 'ALADIN'
                WHEN 'ELIB_PORTAL_V1' THEN 'PORTAL' WHEN 'GANGNAM_V1' THEN 'IN_HOUSE' END
        # spec R3; only NULL rows. BOOKCUBE SUBSCRIPTION: totalVolume 0 with books listed
        # (scripts/library/bookcube-volume-2026-10-11.tsv); KYOBO subscription rows not in the probe: SUBSCRIPTION
        - sql:
            sql: >-
              UPDATE library.library SET lending_model = 'OWNED'
              WHERE lending_model IS NULL
                AND platform_type IN ('KYOBO_V1', 'YES24_V1', 'YES24_V2', 'YES24_V3', 'ALADIN_V1', 'GANGNAM_V1')
        - sql:
            sql: >-
              UPDATE library.library SET lending_model = 'SUBSCRIPTION'
              WHERE lending_model IS NULL AND platform_type = 'BOOKCUBE_FX' AND id IN (339, 380, 386, 705)
        - sql:
            sql: >-
              UPDATE library.library SET lending_model = 'OWNED'
              WHERE lending_model IS NULL AND platform_type = 'BOOKCUBE_FX'
        - sql:
            sql: >-
              UPDATE library.library SET lending_model = 'SUBSCRIPTION'
              WHERE lending_model IS NULL AND platform_type = 'KYOBO_SUBSCRIPTION_V1'
                AND id IN (59, 131, 140, 275, 276, 277, 278)
        - sql:
            sql: ALTER TABLE library.library ADD COLUMN order_no integer NOT NULL DEFAULT 1
        - sql:
            sql: >-
              ALTER TABLE library.library
                ADD CONSTRAINT library_vendor_required_check CHECK (library_type <> 'EBOOK' OR vendor IS NOT NULL),
                ADD CONSTRAINT library_lending_model_required_check CHECK ((vendor = 'PORTAL') = (lending_model IS NULL)),
                ADD CONSTRAINT library_order_no_check CHECK (order_no >= 1)
        # last, so no state in between breaks it; disabled libraries count too
        - sql:
            sql: >-
              ALTER TABLE library.library ADD CONSTRAINT library_classification_key
              UNIQUE NULLS NOT DISTINCT (name, vendor, lending_model, order_no)
