# Libraries with no e-books turned off (enabled = false): kept in the seed, left out of every plan and of the import.
# Cycle 18 step A1, ADR-0109, user decision 2026-10-14 (the 22 ids of plan cycle 18 spec R1). On the service DB
# (2026-10-14) each was enabled with 0 rows in catalog.holding, except 261 (80 rows of a site that moved). Causes:
#   audiobooks only (14): 112, 168, 305, 318, 378, 425, 455, 514, 537, 622, 623, 625, 626, 721
#        (every collected row is AUDIOBOOK and the import leaves audiobooks out; 168 and 305 are one body)
#   no books on the site (1): 323 ("전체 (0종)")
#   Kyobo subscription server, 0 books at the 2026-10-04 crawl (4): 1045, 1131, 1620, 2023
#        (turned on again if a crawl from another IP finds books, spec R1-4)
#   not crawled, already known (2): 44 (empty page to scripts), 269 (resets scripted connections)
#   moved to another site (1): 261 (= library 46, the same Gunpo site)
# docs/libraries/library-site-issues.md 11절, scripts/library/disabled_reasons.tsv.
databaseChangeLog:
  - changeSet:
      id: library-016-disabled-cycle18
      author: chaekcheck
      changes:
        - sql:
            sql: UPDATE library.library SET enabled = false, updated_at = now() WHERE id IN (44, 112, 168, 261, 269, 305, 318, 323, 378, 425, 455, 514, 537, 622, 623, 625, 626, 721, 1045, 1131, 1620, 2023)
