# popular module (cycle 10; ADR-0073, ADR-0075): the monthly sales ranking of the publishing distribution network
# (bnk.kpipa.or.kr), its category sales counts and the small covers fetched ahead. No foreign key or join to other
# modules: catalog books are matched by the isbn13 value when shown (ADR-0074). No author column (spec "입력과 출력").
# No updated_at column, so no trigger (ADR-0068 does not apply). Ranking rows are never deleted (spec R1-5); covers
# no ranking of the latest two months uses are deleted after a fetch (ADR-0075).
# CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no CHECK); splitStatements: false where a
# string literal could hold a semicolon (plan cycle 09 retro).
databaseChangeLog:
  - changeSet:
      id: popular-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA popular

  - changeSet:
      id: popular-001-fetch-run
      author: chaekcheck
      changes:
        # One row per fetch. SUCCEEDED rows are written in the ranking's transaction, FAILED rows alone; only the
        # cover counts are updated later (plan cycle 10 design-delta "받기 기록 쓰는 순서").
        - sql:
            splitStatements: false
            sql: >-
              CREATE TABLE popular.fetch_run (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT fetch_run_pkey PRIMARY KEY,
                target_month date NOT NULL
                  CONSTRAINT fetch_run_target_month_check CHECK (EXTRACT(DAY FROM target_month) = 1),
                trigger text NOT NULL
                  CONSTRAINT fetch_run_trigger_check CHECK (trigger IN ('STARTUP', 'SCHEDULED')),
                started_at timestamp with time zone NOT NULL,
                finished_at timestamp with time zone NOT NULL,
                status text NOT NULL CONSTRAINT fetch_run_status_check CHECK (status IN ('SUCCEEDED', 'FAILED')),
                failure_reason text CONSTRAINT fetch_run_failure_reason_check CHECK (failure_reason IN
                  ('session_failed', 'request_rejected', 'format_changed', 'too_few_books', 'network_error')),
                failure_detail text,
                request_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_request_count_check CHECK (request_count >= 0),
                book_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_book_count_check CHECK (book_count >= 0),
                missing_isbn_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_missing_isbn_count_check CHECK (missing_isbn_count >= 0),
                cover_fetched_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_cover_fetched_count_check CHECK (cover_fetched_count >= 0),
                cover_failed_count integer NOT NULL DEFAULT 0
                  CONSTRAINT fetch_run_cover_failed_count_check CHECK (cover_failed_count >= 0),
                CONSTRAINT fetch_run_failure_reason_status_check
                  CHECK ((status = 'FAILED') = (failure_reason IS NOT NULL))
              )
        # the fetch decision reads a month's runs in start order
        - sql:
            sql: CREATE INDEX fetch_run_target_month_started_at_idx ON popular.fetch_run (target_month, started_at)

  - changeSet:
      id: popular-001-ranking
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE popular.ranking_month (
                target_month date CONSTRAINT ranking_month_pkey PRIMARY KEY
                  CONSTRAINT ranking_month_target_month_check CHECK (EXTRACT(DAY FROM target_month) = 1),
                fetch_run_id bigint NOT NULL
                  CONSTRAINT ranking_month_fetch_run_id_fkey REFERENCES popular.fetch_run (id),
                fetched_at timestamp with time zone NOT NULL
              )
        # category_code: ALL or the site's 20-digit category id (PopularCategory). sales_copies is NULL for ALL only.
        - sql:
            splitStatements: false
            sql: >-
              CREATE TABLE popular.ranking_category (
                target_month date NOT NULL CONSTRAINT ranking_category_target_month_fkey
                  REFERENCES popular.ranking_month (target_month) ON DELETE CASCADE,
                category_code text NOT NULL CONSTRAINT ranking_category_category_code_check
                  CHECK (category_code = 'ALL' OR category_code ~ '^[0-9]{20}$'),
                sales_copies bigint CONSTRAINT ranking_category_sales_copies_check CHECK (CASE
                  WHEN category_code = 'ALL' THEN sales_copies IS NULL
                  ELSE sales_copies IS NOT NULL AND sales_copies >= 0 END),
                display_order smallint NOT NULL
                  CONSTRAINT ranking_category_display_order_check CHECK (display_order BETWEEN 0 AND 16),
                CONSTRAINT ranking_category_pkey PRIMARY KEY (target_month, category_code),
                CONSTRAINT ranking_category_target_month_display_order_key UNIQUE (target_month, display_order)
              )
        # rank = position in the site's list. isbn13 NULL when the site's value is empty or not an ISBN-13.
        # cover_path: the small cover's path on the same site (/files/isbn/.../s_<id>.jpg), NULL when unusable.
        - sql:
            splitStatements: false
            sql: >-
              CREATE TABLE popular.ranking_entry (
                target_month date NOT NULL,
                category_code text NOT NULL,
                rank smallint NOT NULL CONSTRAINT ranking_entry_rank_check CHECK (rank BETWEEN 1 AND 50),
                isbn13 text CONSTRAINT ranking_entry_isbn13_check CHECK (isbn13 ~ '^97[89][0-9]{10}$'),
                title text NOT NULL,
                thema text,
                cover_path text CONSTRAINT ranking_entry_cover_path_check CHECK (cover_path LIKE '/%'),
                CONSTRAINT ranking_entry_pkey PRIMARY KEY (target_month, category_code, rank),
                CONSTRAINT ranking_entry_target_month_category_code_fkey FOREIGN KEY (target_month, category_code)
                  REFERENCES popular.ranking_category (target_month, category_code) ON DELETE CASCADE
              )

  - changeSet:
      id: popular-001-cover
      author: chaekcheck
      changes:
        # One small cover per site path, served at /api/v1/popular-books/covers/{id} (ADR-0075). Matched to
        # ranking_entry.cover_path by value, no foreign key: covers outlive a month and are cleaned up by the fetch.
        - sql:
            sql: >-
              CREATE TABLE popular.cover (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT cover_pkey PRIMARY KEY,
                source_path text NOT NULL CONSTRAINT cover_source_path_key UNIQUE
                  CONSTRAINT cover_source_path_check CHECK (source_path LIKE '/%'),
                content_type text NOT NULL,
                image bytea NOT NULL,
                byte_size integer NOT NULL CONSTRAINT cover_byte_size_check CHECK (byte_size >= 0),
                fetched_at timestamp with time zone NOT NULL
              )
