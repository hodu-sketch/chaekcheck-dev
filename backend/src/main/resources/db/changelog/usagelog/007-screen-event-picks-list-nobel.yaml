# The Bokklubben World Library list nobel (user 2026-10-20) in the picks screen events. 006 is applied in
# production, so its check is made again here with nobel added.
databaseChangeLog:
  - changeSet:
      id: usagelog-007-screen-event-picks-list-nobel
      author: chaekcheck
      changes:
        - sql:
            sql: ALTER TABLE usagelog.screen_event DROP CONSTRAINT screen_event_picks_list_check
        - sql:
            sql: >-
              ALTER TABLE usagelog.screen_event ADD CONSTRAINT screen_event_picks_list_check
                CHECK (picks_list IN ('librarian', 'leedongjin', 'snu100', 'kaist', 'nobel'))
