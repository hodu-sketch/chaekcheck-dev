# The import records moved to collection.catalog_import (ADR-0060). catalog_library_snapshot stays in catalog (the
# search reads collected_at); its import_id pointed at the old table across what is now a module line, and nothing
# reads it, so the column goes. Old import rows are not moved: there is no deployment yet (PRE_DEPLOYMENT).
databaseChangeLog:
  - changeSet:
      id: catalog-003-drop-catalog-import
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              ALTER TABLE catalog.catalog_library_snapshot DROP COLUMN import_id;
              DROP TABLE catalog.catalog_import
