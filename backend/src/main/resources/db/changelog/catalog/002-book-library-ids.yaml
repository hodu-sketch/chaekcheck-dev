# book.library_ids: the service libraries that hold the book, sorted (ADR-0055). The import fills it; /books filters
# with library_ids && :planned and never reads holding. Only right as of the last import.
# The default fills rows already there (a local database with an import) and is dropped at once: the import always
# gives the value.
databaseChangeLog:
  - changeSet:
      id: catalog-002-book-library-ids
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              ALTER TABLE catalog.book ADD COLUMN library_ids bigint[] NOT NULL DEFAULT '{}';
              ALTER TABLE catalog.book ALTER COLUMN library_ids DROP DEFAULT;
              CREATE INDEX book_library_ids_gin ON catalog.book USING gin (library_ids)
