# catalog module: collected e-book list (ADR-0028, ADR-0032, ADR-0034). Data is loaded by the collection module's
# import through CatalogLoad (profile collection-import, ADR-0031, ADR-0060), never by Liquibase. The import records
# live in collection.catalog_import.
# Before the first deployment (PRE_DEPLOYMENT) the cycle 07 changesets catalog-002 (library_ids) and catalog-003
# (catalog_import moved out) were folded in here (step 17).
# holding.library_id holds a library module id only: no foreign key across modules, and no foreign key to
# catalog_library_snapshot either [안] (both are filled by one import; refresh order is decided later).
# Foreign keys inside the module are ON DELETE CASCADE [안] so a new import can delete by book and by import.
# *_norm columns hold the values of catalog.internal.normalize; the same code cleans the search words.
# CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no CHECK).
databaseChangeLog:
  - changeSet:
      id: catalog-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA catalog
        # pg_bigm 1.2 needs shared_preload_libraries = 'pg_bigm' (docker/postgres-bigm sets it)
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_bigm WITH SCHEMA public

  - changeSet:
      id: catalog-001-book
      author: chaekcheck
      changes:
        # content_type: EBOOK plus the kinds the user chose to import (2026-09-30: KIDS_BOOK, PAPER, UNKNOWN).
        # Audiobooks and video books are never imported [확정].
        - sql:
            sql: >-
              CREATE TABLE catalog.book (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT book_pkey PRIMARY KEY,
                title text NOT NULL,
                author_display text,
                publisher text,
                title_norm text NOT NULL,
                main_title_norm text NOT NULL,
                publisher_norm text,
                published_on date,
                isbn13 text CONSTRAINT book_isbn13_key UNIQUE
                  CONSTRAINT book_isbn13_check CHECK (isbn13 ~ '^97[89][0-9]{10}$'),
                content_type text NOT NULL
                  CONSTRAINT book_content_type_check CHECK (content_type IN ('EBOOK', 'KIDS_BOOK', 'PAPER', 'UNKNOWN')),
                library_ids bigint[] NOT NULL,
                created_at timestamp with time zone NOT NULL DEFAULT now()
              )

  - changeSet:
      id: catalog-001-book-contributor
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE catalog.book_contributor (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT book_contributor_pkey PRIMARY KEY,
                book_id bigint NOT NULL
                  CONSTRAINT book_contributor_book_id_fkey REFERENCES catalog.book (id) ON DELETE CASCADE,
                name text NOT NULL,
                alias text,
                name_norm text NOT NULL,
                name_exact text NOT NULL,
                role text NOT NULL
                  CONSTRAINT book_contributor_role_check CHECK (role IN
                    ('AUTHOR', 'TRANSLATOR', 'ILLUSTRATOR', 'EDITOR', 'OTHER', 'UNKNOWN')),
                position smallint NOT NULL CONSTRAINT book_contributor_position_check CHECK (position >= 0)
              )

  - changeSet:
      id: catalog-001-holding
      author: chaekcheck
      changes:
        # content_type: the collected kind of this row (the book's kind is the most common one of its holdings)
        - sql:
            sql: >-
              CREATE TABLE catalog.holding (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT holding_pkey PRIMARY KEY,
                book_id bigint NOT NULL
                  CONSTRAINT holding_book_id_fkey REFERENCES catalog.book (id) ON DELETE CASCADE,
                library_id bigint NOT NULL,
                platform text NOT NULL,
                item_key text NOT NULL,
                detail_url text NOT NULL CONSTRAINT holding_detail_url_check CHECK (detail_url ~ '^https?://'),
                content_type text NOT NULL
                  CONSTRAINT holding_content_type_check CHECK (content_type IN ('EBOOK', 'KIDS_BOOK', 'PAPER', 'UNKNOWN')),
                title_raw text,
                author_raw text,
                publisher_raw text,
                published_raw text,
                supplier text,
                alt_code text,
                first_seen_at timestamp with time zone NOT NULL,
                CONSTRAINT holding_library_item_key UNIQUE (library_id, item_key)
              )

  - changeSet:
      id: catalog-001-library-snapshot
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE catalog.catalog_library_snapshot (
                library_id bigint CONSTRAINT catalog_library_snapshot_pkey PRIMARY KEY,
                collected_at timestamp with time zone NOT NULL
              )

  - changeSet:
      id: catalog-001-indexes
      author: chaekcheck
      changes:
        # [안] design-delta "데이터"; measured in research search-and-normalization 3.2.1.
        # published_on needs both directions: a backward scan cannot keep NULLS LAST.
        - sql:
            sql: >-
              CREATE INDEX book_title_norm_bigm ON catalog.book USING gin (title_norm gin_bigm_ops);
              CREATE INDEX book_publisher_norm_bigm ON catalog.book USING gin (publisher_norm gin_bigm_ops);
              CREATE INDEX book_main_title_norm_exact ON catalog.book (main_title_norm COLLATE "C");
              CREATE INDEX book_title_norm_exact ON catalog.book (title_norm COLLATE "C");
              CREATE INDEX book_publisher_norm_exact ON catalog.book (publisher_norm COLLATE "C");
              CREATE INDEX book_published_on_desc ON catalog.book (published_on DESC NULLS LAST, id);
              CREATE INDEX book_published_on_asc ON catalog.book (published_on ASC NULLS LAST, id);
              CREATE INDEX book_contributor_name_norm_bigm ON catalog.book_contributor USING gin (name_norm gin_bigm_ops);
              CREATE INDEX book_contributor_name_exact ON catalog.book_contributor (name_exact COLLATE "C");
              CREATE INDEX book_contributor_book_id ON catalog.book_contributor (book_id);
              CREATE INDEX holding_book_id_library_id ON catalog.holding (book_id, library_id);
              CREATE INDEX book_library_ids_gin ON catalog.book USING gin (library_ids)
