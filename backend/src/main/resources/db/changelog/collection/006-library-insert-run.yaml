# cycle 13 (ADR-0084, ADR-0093): one row per run of the library-insert command (collection module), never deleted.
# report_id: the preview report the run was checked against (first 12 hex digits of its SHA-256). payload: the
# libraries, eligibility rules and collection links the run put in (or tried to, on a failed run); the export carries
# the succeeded rows to production as load_manifest.notes.libraryPart (ADR-0086). join_surveyed_on: the date of the
# join-condition survey the rules folder holds (ADR-0087), read by GET /api/v1/join-surveys/latest.
# A report goes in once: one succeeded row per report_id; failed rows may repeat.
# CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no CHECK).
databaseChangeLog:
  - changeSet:
      id: collection-006-library-insert-run
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE collection.library_insert_run (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT library_insert_run_pkey PRIMARY KEY,
                report_id text NOT NULL
                  CONSTRAINT library_insert_run_report_id_check CHECK (report_id ~ '^[0-9a-f]{12}$'),
                ran_at timestamp with time zone NOT NULL DEFAULT now(),
                snapshot text NOT NULL,
                inserted_count integer NOT NULL
                  CONSTRAINT library_insert_run_inserted_count_check CHECK (inserted_count >= 0),
                join_surveyed_on date,
                status text NOT NULL
                  CONSTRAINT library_insert_run_status_check CHECK (status IN ('SUCCEEDED', 'FAILED')),
                failure_detail text,
                payload jsonb NOT NULL,
                CONSTRAINT library_insert_run_failure_detail_check
                  CHECK ((status = 'FAILED') = (failure_detail IS NOT NULL))
              )
        - sql:
            sql: >-
              CREATE UNIQUE INDEX library_insert_run_report_id_succeeded_key
                ON collection.library_insert_run (report_id) WHERE status = 'SUCCEEDED'
