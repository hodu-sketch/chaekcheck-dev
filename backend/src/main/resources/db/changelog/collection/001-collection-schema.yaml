# collection module: collection DB library id -> service library id, and the import records (ADR-0052, ADR-0060).
# library_id holds a library module id only: no foreign key across modules. The links of registered libraries (same
# id on both sides) are seed rows too, so this module never reads library.library.
# catalog_import moves here from the catalog module (catalog/003 drops the old table).
# CHECK constraints and IDENTITY use sql changes (Liquibase OSS YAML has no CHECK).
databaseChangeLog:
  - changeSet:
      id: collection-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA collection

  - changeSet:
      id: collection-001-collection-link
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE collection.collection_link (
                collection_library_id bigint CONSTRAINT collection_link_pkey PRIMARY KEY
                  CONSTRAINT collection_link_collection_library_id_check CHECK (collection_library_id > 0),
                library_id bigint NOT NULL CONSTRAINT collection_link_library_id_key UNIQUE
                  CONSTRAINT collection_link_library_id_check CHECK (library_id > 0),
                created_at timestamp with time zone NOT NULL DEFAULT now()
              )

  - changeSet:
      id: collection-001-catalog-import
      author: chaekcheck
      changes:
        # The columns of the old catalog.catalog_import, plus the library counts and the skipped rows by reason
        # (AC-11). skipped_by_reason: {"library_not_in_service": 123, ...}
        # Book ids (plan catalog-refresh.md 5.2, 2026-10-05): kept from the previous import, new, and old ids no book
        # has now. Folded in from collection-003 before the first deployment (step 17).
        # other_library_count was candidate_library_count: renamed in place in cycle 13 (AC-11, no "candidate"
        # libraries any more) under the pre-deployment rule (PRE_DEPLOYMENT); local databases keep their data with the
        # rename SQL in docs/maintenance/3-import.md.
        - sql:
            sql: >-
              CREATE TABLE collection.catalog_import (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT catalog_import_pkey PRIMARY KEY,
                source text NOT NULL,
                imported_at timestamp with time zone NOT NULL,
                book_count integer NOT NULL CONSTRAINT catalog_import_book_count_check CHECK (book_count >= 0),
                holding_count integer NOT NULL
                  CONSTRAINT catalog_import_holding_count_check CHECK (holding_count >= 0),
                skipped_count integer NOT NULL
                  CONSTRAINT catalog_import_skipped_count_check CHECK (skipped_count >= 0),
                registered_library_count integer NOT NULL
                  CONSTRAINT catalog_import_registered_library_count_check CHECK (registered_library_count >= 0),
                other_library_count integer NOT NULL
                  CONSTRAINT catalog_import_other_library_count_check CHECK (other_library_count >= 0),
                skipped_by_reason jsonb NOT NULL,
                kept_book_id_count integer NOT NULL DEFAULT 0
                  CONSTRAINT catalog_import_kept_book_id_count_check CHECK (kept_book_id_count >= 0),
                new_book_id_count integer NOT NULL DEFAULT 0
                  CONSTRAINT catalog_import_new_book_id_count_check CHECK (new_book_id_count >= 0),
                dropped_book_id_count integer NOT NULL DEFAULT 0
                  CONSTRAINT catalog_import_dropped_book_id_count_check CHECK (dropped_book_id_count >= 0)
              )
