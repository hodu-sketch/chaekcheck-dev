# Book ids carry over between imports (plan catalog-refresh.md 5.2, user request 2026-10-05): each import records how
# many books kept an id from the previous import, got a new id, and how many old ids no book has now.
# Rows written before this change get 0.
databaseChangeLog:
  - changeSet:
      id: collection-003-catalog-import-book-ids
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              ALTER TABLE collection.catalog_import
                ADD COLUMN kept_book_id_count integer NOT NULL DEFAULT 0
                  CONSTRAINT catalog_import_kept_book_id_count_check CHECK (kept_book_id_count >= 0),
                ADD COLUMN new_book_id_count integer NOT NULL DEFAULT 0
                  CONSTRAINT catalog_import_new_book_id_count_check CHECK (new_book_id_count >= 0),
                ADD COLUMN dropped_book_id_count integer NOT NULL DEFAULT 0
                  CONSTRAINT catalog_import_dropped_book_id_count_check CHECK (dropped_book_id_count >= 0)
