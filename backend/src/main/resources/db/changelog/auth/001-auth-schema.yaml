# auth module: accounts, login methods, consents and refresh tokens (cycle 05; ADR-0036, ADR-0038, ADR-0039).
# Only the account number, login methods, consents and refresh tokens are kept. Child rows go with the account
# through ON DELETE CASCADE; an account is deleted with one DELETE on auth.account.
# login_method has no UNIQUE (account_id): one method per account is kept by the application, so a later
# "link another login" feature is not blocked (ADR-0039).
# CHECK constraints and UNIQUE NULLS NOT DISTINCT are not available in Liquibase OSS YAML, so they use sql changes.
databaseChangeLog:
  - changeSet:
      id: auth-001-schema
      author: chaekcheck
      changes:
        - sql:
            sql: CREATE SCHEMA auth

  - changeSet:
      id: auth-001-account
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE auth.account (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT account_pkey PRIMARY KEY,
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                last_login_at timestamp with time zone NOT NULL
              )

  - changeSet:
      id: auth-001-login-method
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE auth.login_method (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT login_method_pkey PRIMARY KEY,
                account_id bigint NOT NULL
                  CONSTRAINT login_method_account_id_fkey REFERENCES auth.account (id) ON DELETE CASCADE,
                method text NOT NULL CONSTRAINT login_method_method_check CHECK (method IN ('NAVER', 'KAKAO')),
                subject text NOT NULL,
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                CONSTRAINT login_method_method_subject_key UNIQUE (method, subject)
              )
        - createIndex:
            schemaName: auth
            tableName: login_method
            indexName: login_method_account_id_idx
            columns:
              - column:
                  name: account_id

  - changeSet:
      id: auth-001-account-consent
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE auth.account_consent (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT account_consent_pkey PRIMARY KEY,
                account_id bigint NOT NULL
                  CONSTRAINT account_consent_account_id_fkey REFERENCES auth.account (id) ON DELETE CASCADE,
                consent_type text NOT NULL
                  CONSTRAINT account_consent_consent_type_check
                    CHECK (consent_type IN ('TERMS_OF_SERVICE', 'PRIVACY_COLLECTION', 'AGE_OVER_14')),
                document_version text,
                agreed_at timestamp with time zone NOT NULL,
                CONSTRAINT account_consent_document_version_check
                  CHECK (consent_type = 'AGE_OVER_14' OR document_version IS NOT NULL),
                CONSTRAINT account_consent_key
                  UNIQUE NULLS NOT DISTINCT (account_id, consent_type, document_version)
              )
        - createIndex:
            schemaName: auth
            tableName: account_consent
            indexName: account_consent_account_id_idx
            columns:
              - column:
                  name: account_id

  - changeSet:
      id: auth-001-refresh-token
      author: chaekcheck
      changes:
        - sql:
            sql: >-
              CREATE TABLE auth.refresh_token (
                id bigint GENERATED BY DEFAULT AS IDENTITY CONSTRAINT refresh_token_pkey PRIMARY KEY,
                account_id bigint NOT NULL
                  CONSTRAINT refresh_token_account_id_fkey REFERENCES auth.account (id) ON DELETE CASCADE,
                token_hash bytea NOT NULL CONSTRAINT refresh_token_token_hash_key UNIQUE,
                previous_token_hash bytea,
                expires_at timestamp with time zone NOT NULL,
                created_at timestamp with time zone NOT NULL DEFAULT now(),
                rotated_at timestamp with time zone
              )
        - createIndex:
            schemaName: auth
            tableName: refresh_token
            indexName: refresh_token_previous_token_hash_idx
            columns:
              - column:
                  name: previous_token_hash
        - createIndex:
            schemaName: auth
            tableName: refresh_token
            indexName: refresh_token_account_id_idx
            columns:
              - column:
                  name: account_id
        - createIndex:
            schemaName: auth
            tableName: refresh_token
            indexName: refresh_token_expires_at_idx
            columns:
              - column:
                  name: expires_at
