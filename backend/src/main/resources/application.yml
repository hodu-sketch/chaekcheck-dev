spring:
  application:
    name: chaekcheck
  config:
    # DB values live in the repository root .env (see ../.env.example). Real environment variables win.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    # test-data = fake abolished regions for local development and tests (AC-20).
    # TODO: a production profile must set contexts without test-data. With no contexts set, Liquibase runs every changeset.
    contexts: test-data
  mvc:
    problemdetails:
      # RFC 9457 error responses (ADR-0008). Default is false in Spring Boot 4.1.
      enabled: true
  modulith:
    events:
      jdbc:
        # The event publication table comes from Liquibase (db/changelog/modulith), never from Spring Modulith
        schema-initialization:
          enabled: false
        schema: modulith
      # Completed publications are deleted, not kept (ADR-0041)
      completion-mode: delete
      # On start, publications a listener has not completed (also FAILED ones: Spring Modulith 2.1.1 selects
      # "completion_date IS NULL OR status != 'COMPLETED'") go to their listeners again, so a deleted account's
      # "내 도서관" rows are removed after a failure at the latest at the next restart (ADR-0051)
      republish-outstanding-events-on-restart: true
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes go through Liquibase only
      ddl-auto: validate

server:
  servlet:
    session:
      # Only the login feature uses the session: values kept during a login (pending sign-up, re-authentication),
      # never the login itself (handoff C12, ADR-0040). Nothing creates a session while login is off.
      timeout: 10m
      cookie:
        path: /api/v1
        secure: true
        http-only: true
        same-site: lax

chaekcheck:
  auth:
    # Login on/off (ADR-0046). false = no login, the application behaves as in cycle 04 and needs none of the keys
    # below. Set CHAEKCHECK_AUTH_ENABLED in ../.env or the environment, or change the default here.
    enabled: ${CHAEKCHECK_AUTH_ENABLED:false}
    # Secrets: environment variables only (names in ../.env.example). Required when enabled is true.
    jwt:
      secret: ${AUTH_JWT_SECRET:}
    # Providers offered on the login screen (AC-22, constraint 38). An off provider's login, callback and -reauth
    # addresses are 404 and its keys are not needed. Example: kakao only until Naver's review is done.
    providers: ${AUTH_PROVIDERS:naver,kakao}
    # Address users open the site with; redirect URIs are built from it (C18). Development: the Vite dev server.
    public-base-url: ${AUTH_PUBLIC_BASE_URL:}
    # Endpoints checked against the official guides on 2026-10-04 (client_id and client_secret go as form parameters):
    # https://github.com/naver/naver-openapi-guide/blob/master/ko/login/devguide/devguide.md
    # https://developers.kakao.com/docs/ko/kakaologin/rest-api
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      authorization-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      # The id is response.id
      user-info-uri: https://openapi.naver.com/v1/nid/me
      # Revokes the access token kept for an abandoned sign-up (POST client_id, client_secret, token, token_type_hint)
      unlink-uri: https://nid.naver.com/oauth2.0/revoke
    kakao:
      # Kakao's "REST API key" is the OAuth client id
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      # The id is the top-level id (a number, stored as text)
      user-info-uri: https://kapi.kakao.com/v2/user/me
      # Unlink with the admin key: Authorization: KakaoAK <key>, target_id_type=user_id, target_id=<id>
      unlink-uri: https://kapi.kakao.com/v1/user/unlink
      # Kakao's "service app admin key" (secret). The unlink webhook's "primary admin key" is the same key (console,
      # 2026-10-04): it arrives as Authorization: KakaoAK <key>.
      admin-key: ${KAKAO_ADMIN_KEY:}
      # Kakao app number (not secret); the unlink webhook's app_id must match it
      app-id: ${KAKAO_APP_ID:}
      # Users linked to the app (admin key, limit 1-100, from_id, 100 calls a minute): the daily link check (C29)
      user-ids-uri: https://kapi.kakao.com/v1/user/ids
    provider-calls:
      # [확정] (user approval 2026-10-04, C20); not from a provider document, to be checked with real calls
      connect-timeout: 3s
      read-timeout: 5s
    tokens:
      # [확정] (ADR-0038): access JWT 15 minutes; one login lasts 30 days from sign-in, refresh does not extend it
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      # A withdrawal re-authentication counts for 5 minutes [확정] (ADR-0043)
      reauthentication-ttl: 5m
      # A pending sign-up counts for 10 minutes from the provider login [확정] (ADR-0040)
      pending-signup-ttl: 10m
    cleanup:
      # Daily clean-up jobs (expired refresh tokens; later Kakao link check and inactive accounts), 04:00 Asia/Seoul
      # [확정] (user approval 2026-10-04). Spring cron: second minute hour day month weekday.
      cron: "0 0 4 * * *"
      zone: Asia/Seoul
      # Accounts not signed in for this long are deleted (C30) [확정] (approved proposal, not from a document)
      inactive-after: 1y
      # Kakao allows 100 user-list calls a minute per app; 0.7 s apart stays below it
      kakao-call-interval: 700ms
  lookup:
    # Where the lookup state kept in memory lives (status memo, last DB error time, HostQueueBoard, SearchSlots
    # refusal time; ADR-0133). Only "memory" exists; another value stops the start. Redis comes when the service
    # runs on several instances. docs/maintenance/settings-index.md
    state-store: memory
  catalog:
    books:
      # GET /api/v1/books page size when pageSize is not sent; the maximum stays 20 (BookParams.MAX_PAGE_SIZE).
      # 20 -> 10 [확정] (cycle 20 ADR-0132, spec R15). docs/maintenance/settings-index.md
      default-page-size: 10
  availability:
    cache-ttl: 3m
    # cycle 08 (ADR-0066): one limit per cache, statistics logged. 1,000 each as before [안] until step 9 measures them.
    caches:
      search-page-max-size: 1000
      detail-verdict-max-size: 1000
      stats-log-interval: 5m
    # Per egress lane and library host (webshare cycle (in cycle 20), ADR-0130; before webshare cycle (in cycle 20) the same values were per host for the
    # one direct path): 1 request at a time, the next one 1s after the previous ended. docs/maintenance/settings-index.md
    host-max-concurrency: 1
    host-min-interval: 1s
    # Egress lanes (webshare cycle (in cycle 20), handoff 1-15, ADR-0130): the server's own IP ("direct") plus one lane per proxy in
    # egress.proxies. Production: EC2 IP + 20 Webshare KR static proxies; local default: direct only.
    # docs/maintenance/settings-index.md, names and log shapes in docs/plan-feedback.md (# 사이클 22)
    egress:
      # all = every lane / proxy-only = never the direct lane (retests included, no fallback when every proxy lane
      # is paused) / direct-only = the direct lane only. proxy-only with an empty proxy list stops the start.
      # The ${…} placeholders read ../.env (spring.config.import above) as well as real environment variables, like
      # the other secrets in this file.
      mode: ${CHAEKCHECK_AVAILABILITY_EGRESS_MODE:all}
      # Comma separated host:port, in order: proxy-01, proxy-02 … The addresses are secrets: ../.env or the
      # environment only, never in this file.
      proxies: ${CHAEKCHECK_AVAILABILITY_EGRESS_PROXIES:}
      # Vendor name in logs (lane=proxy-03 vendor=webshare)
      proxy-vendor: ${CHAEKCHECK_AVAILABILITY_EGRESS_PROXYVENDOR:webshare}
      # One username / password pair for every proxy lane (Webshare "Proxy Username / Proxy Password"). Empty = the
      # vendor authorizes this server's IP (production, IP Authorization = EC2 IP). ../.env or the environment only,
      # never logged (user decision 2026-10-17: the local PC uses the pair).
      proxy-username: ${CHAEKCHECK_AVAILABILITY_EGRESS_PROXYUSERNAME:}
      proxy-password: ${CHAEKCHECK_AVAILABILITY_EGRESS_PROXYPASSWORD:}
      block:
        # A lane stops sending to a host after this many block signals in a row on that lane and host (no answer,
        # or 403 / 407 / 429 / 503) [안 5]; one body-too-large, parse failure or timeout alone never pauses a lane.
        failures-to-block: 5
        # Then one retest request after 10 min; still blocked -> the pause doubles (20, 40, 80 min …) up to 7 days
        # [확정] (from-cycle-20-blocked-ip-resume.md). A 2xx retest resumes the lane.
        first-pause: 10m
        max-pause: 7d
        # how often pauses that ran out are looked for [안]
        retest-check-interval: 30s
        # one retest request, the lane's throttle wait included [안]
        retest-timeout: 20s
        # An answer that took this long counts like no answer above (user decision 2026-10-18: "느린 것도 실패로
        # 세줘"), so a proxy that is slow on a site stops being used there after the same failures-to-block in a row.
        # Detail and search pages usually answer in 0.2-1.5s; the read timeout is 5s [안 3s].
        # docs/maintenance/settings-index.md
        slow-answer: 3s
    # 5s: some sites take 1-3s to connect (Gyeonggi education office, 2026-09-29); cycle 01 value was 3s (user decision 2026-09-29)
    connect-timeout: 5s
    read-timeout: 5s
    # one page outside a batch (the per-library "more" API), throttle wait included
    request-deadline: 8s
    # [안] direct mode: one library request in total, body included (read-timeout above stops at the headers).
    # 15s = the longest wait before the headers today (connect 5s + read 5s) + 5s for the body, so no answer that
    # works now is cut; a site that sends its body very slowly can no longer hold a connection without end.
    total-timeout: 15s
    # Largest library body read, the compressed bytes and the decompressed bytes both (cycle 20, ADR-0132; gzip is
    # asked for and inflated here): past it reading stops and the request fails for that library only, counted as
    # body_too_large. Largest real answers saved (2026-10-05, data/cycle07/probe): BOOKCUBE search XML 322KB (20
    # rows), KYOBO search page 188KB. 4MB -> 1MB [확정] (cycle 20 review #7). Same value as the fetch service and
    # later nginx / the extension (LOOKUP_MAX_BODY_MB). docs/maintenance/settings-index.md
    max-body-size: 1MB
    # Library pages parsed at the same time, search and detail pages together (cycle 20, overall review #4, AC-33):
    # parsing a 1MB page was measured at about 7.4MB of heap, so 8 slots bound the heap whatever the number of search slots (60). A page
    # waits for a slot up to parse-slots.max-wait after its body arrived, then that library alone fails (parse_busy).
    # From stage 2 the extension uploads share the same slots. docs/maintenance/settings-index.md
    parse-slots:
      max: 8
      max-wait: 2s
    # The status signal GET /api/v1/lookup-status (cycle 20, ADR-0118) [확정 values, names 안].
    # docs/maintenance/settings-index.md
    lookup-status:
      # one computed answer is handed out again for this long
      memo: 1s
      # RED for this long after a 503 server_busy
      red-after-refusal: 10s
      # GRAY (reason DB_ERROR) for this long after a DB error seen by the API (overall review #9)
      gray-after-db-error: 30s
      # a host-queue wait older than this no longer counts as queued: batch deadline 8s + 2s (change together)
      queue-wait-window: 10s
      # a throttle timeout keeps that host's libraries queued for this long (spec R4)
      queue-timeout-window: 60s
      # longest queuedLibraryIds list in the answer [안]
      max-queued-libraries: 200
    # One INFO line a minute with the lookup counters (cycle 20, overall review #5, AC-40):
    # docs/maintenance/settings-index.md, field shape in docs/plan-feedback.md (# 사이클 20)
    ops-summary:
      interval: 1m
    # The same numbers recorded in the DB, one row per 10 seconds, in availability.lookup_sample (user decision
    # 2026-10-19 "B: DB에 저장", "파티션 잘 하고"): monthly partitions in Asia/Seoul months, made at start and daily
    # (current + 2 months ahead); month partitions older than the retention are dropped daily. A DB error loses
    # that row only (WARN at most once a minute). docs/maintenance/settings-index.md
    ops-sample:
      # false = nothing written (the test profile sets false)
      enabled: true
      # one row per this long [사용자 10s]
      interval: 10s
      # month partitions that end before now - retention are dropped [안 90d]
      retention: 90d
    # Batch streams and "more" calls running at once; more get 503 server_busy at once (not queued).
    # 60 x parallelism 5 = at most 300 library requests in flight from batches, and the host throttle (1 per host)
    # still applies. 20 -> 40 [확정] (cycle 20 overall review #13), 40 -> 60 (user 2026-10-19: "동시 검색 자리를 60으로");
    # the parse slots below (8) still bound the page-parsing heap. The status signal turns yellow at half and red at all
    # of these slots. docs/maintenance/settings-index.md
    max-concurrent-searches: 60
    batch:
      # no new request once more than 10 rows are counted; requests already started are still received [확정]
      # (20 -> 10, cycle 20 ADR-0132, spec R15). Holding batches (the book page) have no row limit (R15-1).
      # docs/maintenance/settings-index.md
      row-limit: 10
      # [안] libraries fetched at once; to be tuned with real batch timings
      parallelism: 5
      # search pages must answer within 8s of the batch start, else upstream_timeout [확정]
      deadline: 8s
      # [안] no new request when less than this is left
      launch-cutoff: 3s
      # [안] candidates per "next batch" request
      max-candidates: 50
      # 바로 보기 / book page: holdings one batch asks, the next ones in the catalog's order (books, then their
      # libraries), any filter; the rest wait for "더 보기" [확정 10] (user decision 2026-10-18: "결과를 10개 정도
      # 타겟", never hundreds; replaces cycle 20 R15-1's every holding of the visible books).
      # docs/maintenance/settings-index.md
      holding-batch-size: 10
    detail:
      # portal rows with a blank list verdict: detail pages are read until 30s after the batch start [확정 30s]
      deadline: 30s
    kyobo:
      # 10 per page, same as YES24 (user decision 2026-09-27; design value was 50). The site accepts 10.
      record-count: 10
      # Kyobo subscription servers (*.dkyobobook.co.kr, 4-6s an answer): all their host names are one pool per egress
      # lane with this many requests at a time and no 1s interval (ADR-0094, webshare cycle (in cycle 20) handoff 1-15 #3) [확정 3]. A lane
      # drops to 1 at a time after 3 failures in a row or an answer slower than 10s (HostRules, numbers [안]).
      # Environment: CHAEKCHECK_AVAILABILITY_KYOBO_SUBSCRIPTIONMAXCONCURRENCY. docs/maintenance/settings-index.md
      subscription-max-concurrency: 3
      subscription-host-suffix: .dkyobobook.co.kr
    # Popular-order pages for the for-you build (cycle 23, ADR-0148), same lanes and host interval as the lookups.
    # docs/maintenance/settings-index.md
    ranked:
      # KYOBO recordCount: 80 is the sites' largest (pretest 2026-10-24) [안]. TODO(확인 필요): checkpoint B checks an
      # 80-row page stays under max-body-size
      kyobo-page-size: 80
      # YES24 V1 view: 5/10/20/50 offered [안]
      yes24-page-size: 50
      # one page, the lane's host-interval wait included [안]
      request-deadline: 20s
    yes24:
      # "now" is a filter on the site (only books available now), so title order is used (user decision 2026-09-27)
      sort: title
    # TODO: format "chaekcheck/<version> (+<service URL>; <contact>)"; service URL and contact are not decided yet
    # The fetch service uses the same value (FETCH_USER_AGENT in fetch-service).
    user-agent: "chaekcheck/0.0.1"
    fetch:
      # direct = this server calls the libraries; fetch-service = through the fetch servers below (ADR-0015).
      # No automatic switch: if every fetch server is down, lookups fail until this is changed.
      mode: ${FETCH_MODE:direct}
      # TODO(확인 필요): number of fetch servers, where they run, fixed IPs. Priority order.
      servers:
        - id: fetch-1
          url: ${FETCH_SERVER_1_URL:http://localhost:8091}
        - id: fetch-2
          url: ${FETCH_SERVER_2_URL:http://localhost:8092}
      # TODO(확인 필요): header name and how the shared token is stored. Token comes from the environment.
      token-header: X-Fetch-Token
      token: ${FETCH_SERVICE_TOKEN:}
      # TODO(확인 필요): main server -> fetch server timeouts (fetch server -> library is connect 5s, read 5s)
      connect-timeout: 1s
      read-timeout: 7s
      # TODO(확인 필요): how long a fetch server that refused a connection or answered 503 is skipped
      rest-duration: 30s
  # 「나에게 맞는 책」 tab (cycle 23, ADR-0147~0149). docs/maintenance/settings-index.md
  foryou:
    build:
      # Default on; off in tests and in the collection-import profile (CHAEKCHECK_FORYOU_BUILD_ENABLED)
      enabled: ${CHAEKCHECK_FORYOU_BUILD_ENABLED:true}
      # Daily build, Spring cron [안 03:30]: apart from auth.cleanup (04:00) and the picks fetch (05:00); the handoff
      # proposed 04:00. At start a build runs when today has no succeeded build.
      cron: "0 30 3 * * *"
      zone: Asia/Seoul
      # runs older than this are deleted, the last succeeded run is kept [확정 30일]
      keep: 30d
      # base list size (R2-4) [확정 40]
      base-size: 40
      # the memory copy reads the last succeeded build again this often (like the picks cache) [안 10m]
      refresh-interval: 10m
      # a site or feed matching less than this is left out for the day [확정 0.9]
      min-match-rate: 0.9
    sources:
      kyobo-elib:
        enabled: ${CHAEKCHECK_FORYOU_SOURCES_KYOBOELIB_ENABLED:true}
        # 서초구립반포 79, 연천군 99, 도봉문화정보 60, 부천시립 73 [확정 sites] (library seed 004 and the pretest's
        # collection_link: the same ids)
        library-ids: ${CHAEKCHECK_FORYOU_SOURCES_KYOBOELIB_LIBRARYIDS:79,99,60,73}
        # rows per site [확정 100]
        top: 100
      yes24-elib:
        enabled: ${CHAEKCHECK_FORYOU_SOURCES_YES24ELIB_ENABLED:true}
        # 국립세종도서관(YES24) 263, 성남시도서관사업소 229 [확정 sites] (library seed 005, the same in the pretest)
        library-ids: ${CHAEKCHECK_FORYOU_SOURCES_YES24ELIB_LIBRARYIDS:263,229}
        top: 100
      # TODO(확인 필요): range and format checked on the user's PC first (step 0 #7); off until then
      kpipa-rank:
        enabled: false
      kpipa-200:
        enabled: false
      klwave:
        enabled: false
    score:
      # recent demand = on loan + 2 x reservations [확정]
      reservation-weight: 2
      # publish-year distance bands and boosts [확정; checkpoint C 2026-10-25 kept them: "오래된 책은 밀리도록 해줘"]
      year-bands: 3,6,10
      year-boosts: 1.5,1.0,0.6,0.3
      # no publish year [안]
      unknown-year-boost: 1.0
      kpipa-rank-weight: 1.5
      # the 200 list, books the sales rank lacks [안]
      kpipa-200-weight: 1.0
      # [안]
      klwave-weight: 0.3
  picks:
    fetch:
      # Fetching the librarian picks of the National Library of Korea (plan cycle 14, ADR-0089, ADR-0092). Default
      # on; off in tests, in the collection-import profile and for local development (../.env:
      # CHAEKCHECK_PICKS_FETCH_ENABLED=false). Turn it on locally only to try a fetch (user approval, at most once a
      # day): it calls the real API.
      enabled: ${CHAEKCHECK_PICKS_FETCH_ENABLED:true}
      # Open API key, a secret (spec R1-7): ../.env or the deployment's secrets only, never in a file of the
      # repository. Empty: no request is sent, the run is FAILED key_missing.
      api-key: ${CHAEKCHECK_PICKS_NLK_API_KEY:}
      # Daily fetch decision, 05:00 Asia/Seoul [확정]: Mondays, every day after a failure until one succeeds, and
      # catching up a missed week (ADR-0092). Spring cron: second minute hour day month weekday.
      cron: "0 0 5 * * *"
      zone: Asia/Seoul
      base-url: https://nl.go.kr
      # One list request, rows 1 to 1000. Registered in the last 3 years: the latest 12 recommendations (about every two
      # months) always fit (user decision 2026-10-12: 12 recommendations instead of 6; the handoff had 2y). 2y gave 108
      # rows, 1.56MB on 2026-10-12
      window: 3y
      end-row: 1000
      connect-timeout: 5s
      read-timeout: 10s
      max-body-size: 10MB
      # Largest cover image read before it is made smaller (user decision 2026-10-12: "5MB (추천)")
      cover-max-body-size: 5MB
      # At least 1s between cover requests, counted from the end of the previous request [확정]
      request-interval: 1s
      # User decision 2026-10-12 (cycle 10): Java's HTTP client refuses a Korean header value.
      # TODO(확인 필요): the service address is appended at deployment: "book search service (+<service URL>)"
      user-agent: "book search service"
      cover:
        # every cover stored and served as one JPEG width; narrower images keep theirs [확정]
        width: 200
        jpeg-quality: 0.8
        # largest width x height decoded (16M pixels = 64MB as ARGB), so one image cannot fill the 512MB heap
        max-pixels: 16000000
    cache:
      # The shared cache of the picks is read again this often [확정 10m]
      refresh-interval: 10m
  aisearch:
    # AI book search (cycle 24, ADR-0150~0153). Off by default: switched on in production after the key is in the
    # secrets and the privacy policy version is in force (CHAEKCHECK_AISEARCH_ENABLED). Off: the address answers 404
    # and the web hides the AI tab. Values: plan docs/settings-index.md 10절, docs/maintenance/settings-index.md 1-1절
    enabled: ${CHAEKCHECK_AISEARCH_ENABLED:false}
    # the day of the daily limits and of daily_usage
    zone: Asia/Seoul
    # 1st call (keywords) and the whole 2nd call (choice and text) [확정 처음 값]; step 1 maxima 2.4 s and 8.2 s
    keyword-timeout: 5s
    pick-timeout: 15s
    # step 1 (2026-10-24): 1st output at most 285 tokens, 2nd at most 1,490 [안]. The 2nd rose to 3072 (user 2026-10-25):
    # with the 30,000 most held books the cards' texts grew and an answer of 2,143 tokens was cut at 2048
    keyword-max-tokens: 512
    pick-max-tokens: 3072
    # AI searches running at once on this server, apart from the 60 search slots (user 2026-10-24); more: 503
    # server_busy before the stream opens
    max-concurrent: 20
    rate:
      # one IP, follow-up questions too [확정]
      per-minute: 10
      per-day: 100
    budget:
      # checked when a search starts [확정]
      daily-usd: 2
    price:
      # US$ per million tokens, prompts of 100k tokens or fewer [확정] (platform.claude.com pricing, 2026-10-24)
      input-per-mtok: 0.10
      output-per-mtok: 0.50
    limits:
      # books given to the 2nd call / books in one answer / earlier turns sent / question / card text [확정]
      candidates: 30
      picks: 8
      history-turns: 5
      question-max-length: 200
      card-text-max-chars: 300
    llm:
      anthropic:
        # AI book search (cycle 24, ADR-0150). The key is a secret: ../.env or the deployment's secrets only
        # (Parameter Store /chaekcheck/prod/CHAEKCHECK_AISEARCH_ANTHROPIC_API_KEY, cycle 17 way), never in a file of the
        # repository, never logged. Empty: every call fails and the search takes its fallback way (keywords from the
        # question, books without text). docs/maintenance/settings-index.md
        api-key: ${CHAEKCHECK_AISEARCH_ANTHROPIC_API_KEY:}
        model: claude-haiku-5-5
        base-url: https://api.anthropic.com
        # https://platform.claude.com/docs/en/api/versioning (checked 2026-10-24: the latest version)
        version: "2026-10-21"
        # output_config.effort; step 1 (2026-10-24): low keeps both calls fast with thinking left on [안]
        effort: low
  usagelog:
    # Usage log (cycle 15, ADR-0096, ADR-0097). Off by default [확정]: off at the first deployment, switched on at the
    # public opening day when the privacy policy says so (../.env or the environment: CHAEKCHECK_USAGELOG_ENABLED).
    # Off records nothing; POST /api/v1/usage-events still answers 204.
    enabled: ${CHAEKCHECK_USAGELOG_ENABLED:false}
    # Rows waiting in memory at most [확정]; more are dropped and counted in usagelog.dropped_batch (buffer_full)
    buffer-capacity: 10000
    # One write (one transaction, asynchronous commit) this long after the previous one ended [확정]
    flush-interval: 5s
    # Failed batches remembered until a write succeeds; older ones are added to a newer note with the same reason
    max-dropped-notes: 100
    cleanup:
      # IP cleared after 30 days, rejected_event after 30 days, the rest after one year [확정 04:30 Asia/Seoul]. Runs
      # even when logging is off, so rows from a trial period still go. zone is also the day of library answers.
      cron: "0 30 4 * * *"
      zone: Asia/Seoul
      # rows changed or deleted per statement
      batch-size: 10000
