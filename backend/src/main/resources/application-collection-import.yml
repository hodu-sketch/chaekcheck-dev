# Collection import (ADR-0031, ADR-0060): runs once and exits, no web server (docs/maintenance/3-import.md). Paths
# are given as arguments, e.g.
#   --chaekcheck.collection.import.sqlite-path=../../chaekcheck-data/snapshots/ebook-catalog-2026-10-05-0745.sqlite
#   --chaekcheck.collection.import.ttl-path=../data/nlk/ttl
spring:
  main:
    web-application-type: none

chaekcheck:
  # The login feature needs the web server's security setup; the import has no web server (found 2026-10-05: with
  # login on in .env the import did not start).
  auth:
    enabled: false
  # The import never fetches the librarian picks
  picks:
    fetch:
      enabled: false
  collection:
    import:
      # 명지대학교 (collection id 100555) fills unknown dates with 1900~1905 (plan research 2절 7, ADR-0054).
      # Rule: docs/maintenance/rules-index.md "placeholder-date-libraries"
      placeholder-date-libraries: 100555
      # Rules files read before the collection DB (cycle 19: author_publisher_swapped.tsv, supplier_families.tsv;
      # scripts/library/rules/README.md). Relative to backend/, where ./gradlew bootRun runs
      rules-dir: ../scripts/library/rules
      # Recommended lists the export carries (cycle 21, ADR-0123, ADR-0128): fields.tsv, leedongjin.tsv, snu100.tsv
      # and covers/; export and in-place stop before the collection DB when the folder or a file is missing
      lists-dir: ../scripts/crawl/lists
